name: Validate Marketplace Factory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate registry and generated Desktop snapshots
        run: python scripts/factory_validate.py --root .
      - name: Run Factory unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
