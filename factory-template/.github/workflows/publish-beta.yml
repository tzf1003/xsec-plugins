name: Publish Marketplace Factory beta

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: Registered plugin ID to build from its beta branch
        required: true
        type: string
      source_sha:
        description: Exact lowercase 40-character commit SHA already pushed to beta
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # All releases update one generated discovery index, so different plugins
  # must serialize too. A new beta must never cancel an in-flight artifact
  # upload or leave an index pointing at a release whose asset was not checked.
  group: xsec-marketplace-factory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Branch protection tells us which Factory revision is authoritative; it
    # does not authorize the person who clicked workflow_dispatch.  This job
    # can create immutable Releases and write generated metadata, so GitHub
    # Environment approval is the release-authorization boundary.
    environment: production
    steps:
      - name: Require an explicit Factory-main dispatch
        env:
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          [ "$REF" = "refs/heads/main" ] && [ "$REF_PROTECTED" = "true" ] || {
            echo "Run Marketplace Factory publication from a protected refs/heads/main." >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require the isolated source-reader GitHub App secrets
        env:
          FACTORY_GITHUB_APP_ID: ${{ secrets.FACTORY_GITHUB_APP_ID }}
          FACTORY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FACTORY_GITHUB_APP_PRIVATE_KEY }}
        run: |
          [ -n "$FACTORY_GITHUB_APP_ID" ] && [ -n "$FACTORY_GITHUB_APP_PRIVATE_KEY" ] || {
            echo "Configure FACTORY_GITHUB_APP_ID and FACTORY_GITHUB_APP_PRIVATE_KEY before publishing." >&2
            exit 1
          }
      - name: Validate the registered source before requesting repository access
        id: prepare
        env:
          PLUGIN_ID: ${{ inputs.plugin_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python scripts/factory_publish.py --github-output "$GITHUB_OUTPUT" prepare \
            --plugin-id "$PLUGIN_ID" --channel beta --source-sha "$SOURCE_SHA"
      - name: Create a read-only source repository token
        id: source-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_GITHUB_APP_ID }}
          private-key: ${{ secrets.FACTORY_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.prepare.outputs.source_owner }}
          repositories: ${{ steps.prepare.outputs.source_repo }}
          # The source App must be installed with read-only Contents access;
          # request the same minimum permission in the issued token.
          permission-contents: read
      - name: Check out the exact external source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.prepare.outputs.source_repository }}
          ref: ${{ steps.prepare.outputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          path: .factory-source
          fetch-depth: 0
          # The reachability fetch below supplies an ephemeral header. Never
          # leave a GitHub App reader token in untrusted source .git/config.
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Require the exact commit to remain reachable from beta
        env:
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          SOURCE_REF: ${{ steps.prepare.outputs.source_ref }}
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          token_header="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 | tr -d '\n')"
          git -C .factory-source \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $token_header" \
            fetch --no-tags origin "$SOURCE_REF:refs/remotes/origin/xsec-factory-source"
          unset token_header SOURCE_TOKEN
          [ "$(git -C .factory-source rev-parse HEAD)" = "$SOURCE_SHA" ]
          git -C .factory-source cat-file -e "$SOURCE_SHA^{commit}"
          git -C .factory-source merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/xsec-factory-source
          if git -C .factory-source config --local --get-all http.https://github.com/.extraheader >/dev/null; then
            echo "The external source checkout retained an HTTP credential." >&2
            exit 1
          fi
      - name: Build the immutable beta package without executing source scripts
        id: build
        env:
          PLUGIN_ID: ${{ steps.prepare.outputs.plugin_id }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: |
          python scripts/factory_publish.py --github-output "$GITHUB_OUTPUT" beta \
            --plugin-id "$PLUGIN_ID" \
            --source-root .factory-source \
            --source-sha "$SOURCE_SHA" \
            --factory-repository "$GITHUB_REPOSITORY" \
            --artifact-output "$RUNNER_TEMP/xsec-factory-artifacts" \
            --publisher "$GITHUB_ACTOR"
      - name: Validate generated snapshots and release metadata
        run: python scripts/factory_validate.py --root . --factory-repository "$GITHUB_REPOSITORY"
      - name: Create or verify the immutable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.release_tag }}
          ARTIFACT_PATH: ${{ steps.build.outputs.artifact_path }}
          ARTIFACT_NAME: ${{ steps.build.outputs.artifact_name }}
          ARTIFACT_SHA256: ${{ steps.build.outputs.artifact_sha256 }}
          PLUGIN_ID: ${{ steps.build.outputs.plugin_id }}
          RELEASE_ID: ${{ steps.build.outputs.release_id }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/xsec-factory-existing-release"
            mkdir -p "$existing"
            if gh release download "$RELEASE_TAG" --pattern "$ARTIFACT_NAME" --dir "$existing"; then
              [ "$(sha256sum "$existing/$ARTIFACT_NAME" | awk '{print $1}')" = "$ARTIFACT_SHA256" ] || {
                echo "Existing immutable release asset has different bytes." >&2
                exit 1
              }
            else
              gh release upload "$RELEASE_TAG" "$ARTIFACT_PATH#$ARTIFACT_NAME"
            fi
          else
            gh release create "$RELEASE_TAG" "$ARTIFACT_PATH#$ARTIFACT_NAME" \
              --title "${PLUGIN_ID} ${RELEASE_ID}" \
              --notes "Immutable XSEC Marketplace Factory beta artifact."
          fi
      - name: Commit only generated Factory metadata
        env:
          PLUGIN_ID: ${{ steps.build.outputs.plugin_id }}
        run: |
          set -euo pipefail
          git add -- .agents/plugins/marketplace.json "plugins/$PLUGIN_ID" ".xsec-factory/publications/$PLUGIN_ID.json"
          git diff --cached --quiet && exit 0
          git config user.name "xsec-marketplace-factory[bot]"
          git config user.email "xsec-marketplace-factory[bot]@users.noreply.github.com"
          git commit -m "chore: publish $PLUGIN_ID beta"
          git push origin HEAD:refs/heads/main
