name: Plugin source validation

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the dual plugin manifests
        run: |
          test -f plugin.json
          test -f .codex-plugin/plugin.json
      - name: Validate the terminal frontend contract
        run: |
          node --check com.xsec.desktop/frontend/index.js
          python3 -m unittest discover -s tests -p 'test_*.py'

  source-preflight:
    needs: manifest
    uses: tzf1003/xsec-plugins/.github/workflows/first-party-source-preflight.yml@main
    with:
      plugin_id: com.xsec.system-terminal
