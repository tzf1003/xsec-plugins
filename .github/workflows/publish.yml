name: Publish immutable marketplace beta release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  # A generated metadata commit still starts this push workflow before its job
  # condition skips it. Put that no-op run in its own group so it cannot
  # replace a pending manual Stable promotion in the shared publication queue.
  group: >-
    xsec-marketplace-${{ (startsWith(github.event.head_commit.message, 'chore: publish marketplace beta release') || startsWith(github.event.head_commit.message, 'chore: promote marketplace stable release')) && github.run_id || 'publish-main' }}
  cancel-in-progress: false

jobs:
  enforce-publish-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Reject manual dispatches outside protected main
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "Manual marketplace publishing is permitted only from refs/heads/main." >&2
            exit 1
          fi
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "Marketplace publication requires a protected main branch or ruleset." >&2
            exit 1
          fi
  sign-and-publish:
    needs: enforce-publish-ref
    # GitHub's merge API puts the generated title in both the subject and
    # body of the resulting main commit.  Do not recursively build another
    # beta release from a generated beta or stable-pointer metadata commit.
    if: >-
      ${{ needs.enforce-publish-ref.result == 'success' && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'workflow_dispatch' || (!startsWith(github.event.head_commit.message, 'chore: publish marketplace beta release') && !startsWith(github.event.head_commit.message, 'chore: promote marketplace stable release'))) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require the protected marketplace publication token before checkout or KMS
        env:
          XSEC_MARKETPLACE_PUBLISH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$XSEC_MARKETPLACE_PUBLISH_TOKEN" ]; then
            echo "The protected marketplace publication token is required before checkout or KMS signing." >&2
            exit 1
          fi
      # Workflow-level concurrency is acquired before this job begins. Resolve
      # main only after acquiring that slot: a queued run's event SHA may have
      # become stale while an earlier publication merged its signed index.
      - name: Check out current protected main after acquiring the publication slot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main
          # `git push` uses checkout's persisted credential, not GH_TOKEN.
          # Keep that credential on the same narrowly scoped token used by
          # the subsequent GitHub CLI calls.
          token: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
      - name: Record the current protected source revision
        id: current-main
        run: |
          source_revision="$(git rev-parse HEAD)"
          [ "$source_revision" = "$(git rev-parse origin/main)" ] || { echo "Current checkout is not protected main." >&2; exit 1; }
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build an immutable beta release without a private signing key
        run: python scripts/build_market.py --clean
      - name: Validate source manifests, deterministic artifacts and package safety
        run: python scripts/validate_market.py source --source-root . --built-root .
      - name: Request KMS sidecars through the production Cloud broker
        env:
          XSEC_MARKETPLACE_SOURCE_REVISION: ${{ steps.current-main.outputs.source_revision }}
        run: python scripts/kms_marketplace_publisher.py --root .
      - name: Gate the KMS sidecar protocol before publishing
        env:
          XSEC_MARKETPLACE_SOURCE_REVISION: ${{ steps.current-main.outputs.source_revision }}
        run: python scripts/kms_marketplace_publisher.py --root . --validate-only
      - name: Publish generated metadata through a protected pull request
        id: publish
        env:
          # The repository deliberately does not allow the default Actions
          # token to create pull requests. This narrowly scoped fine-grained
          # token is restricted to xsec-plugins and is the only credential
          # permitted to push the generated branch, create/merge its PR, and
          # dispatch the immutable source gate.
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          # Stage the index sidecar as well as the index itself. A KMS sidecar
          # binds exact bytes and must never be left untracked beside a newly
          # published marketplace.json.
          git add -A .agents/plugins plugins
          if git diff --cached --quiet; then
            echo "marketplace_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "xsec-marketplace[bot]"
          git config user.email "xsec-marketplace[bot]@users.noreply.github.com"
          git commit -m "chore: publish marketplace beta release"
          generated_revision="$(git rev-parse HEAD)"
          # A re-run retains GITHUB_RUN_ID but gets a new attempt number. Keep
          # that number in the generated branch so an earlier, divergent
          # publication attempt cannot make this push non-fast-forward.
          branch="xsec-marketplace/publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git push --set-upstream origin "$branch"
          pull_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: publish marketplace beta release" \
            --body "Generated by protected workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. This appends immutable releases as needed and advances beta only; the source gate must pass before the signed update can merge.")"
          pull_number="$(gh pr view "$pull_url" --json number --jq .number)"
          gh workflow run validate.yml --ref "$branch"
          deadline="$((SECONDS + 900))"
          while :; do
            source_gate="$(gh run list \
              --workflow validate.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,status,conclusion \
              | jq -rc --arg revision "$generated_revision" '.[] | select(.headSha == $revision) | @base64' \
              | head -n 1)"
            if [ -n "$source_gate" ]; then
              source_gate_json="$(printf '%s' "$source_gate" | base64 --decode)"
              source_gate_status="$(printf '%s' "$source_gate_json" | jq -r .status)"
              source_gate_conclusion="$(printf '%s' "$source_gate_json" | jq -r .conclusion)"
              if [ "$source_gate_status" = "completed" ]; then
                if [ "$source_gate_conclusion" != "success" ]; then
                  echo "The generated marketplace source gate did not succeed." >&2
                  exit 1
                fi
                break
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for the generated marketplace source gate." >&2
              exit 1
            fi
            sleep 5
          done
          merge_result="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}/merge" \
            -f commit_title="chore: publish marketplace beta release" \
            -f merge_method=merge)"
          if [ "$(printf '%s' "$merge_result" | jq -r .merged)" != "true" ]; then
            echo "The generated marketplace pull request was not merged." >&2
            exit 1
          fi
          echo "marketplace_revision=$(printf '%s' "$merge_result" | jq -r .sha)" >> "$GITHUB_OUTPUT"
      - name: Dispatch the immutable marketplace revision to the Desktop smoke gate
        env:
          XSEC_DESKTOP_REPOSITORY_DISPATCH_TOKEN: ${{ secrets.XSEC_DESKTOP_REPOSITORY_DISPATCH_TOKEN }}
          MARKETPLACE_REVISION: ${{ steps.publish.outputs.marketplace_revision }}
        run: |
          if [ -z "$XSEC_DESKTOP_REPOSITORY_DISPATCH_TOKEN" ] || [ -z "$MARKETPLACE_REVISION" ]; then
            echo "The protected Desktop smoke-dispatch token and marketplace revision are required." >&2
            exit 1
          fi
          # The receiver checks these values against its compiled official
          # GitHub origin. `source_revision` is the protected main revision whose
          # source was signed; `MARKETPLACE_REVISION` is the immutable merge
          # commit containing those sidecars. The former must be an ancestor
          # of the latter, so Desktop can reject redirected dispatch requests.
          payload="$(jq -cn \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_ref "refs/heads/main" \
            --arg source_sha "${{ steps.current-main.outputs.source_revision }}" \
            --arg marketplace_revision "$MARKETPLACE_REVISION" \
            --arg channel "beta" \
            '{event_type:"xsec_official_marketplace_published",client_payload:{source_repository:$source_repository,source_ref:$source_ref,source_sha:$source_sha,marketplace_revision:$marketplace_revision,channel:$channel}}')"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $XSEC_DESKTOP_REPOSITORY_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            https://api.github.com/repos/tzf1003/xSecDesktop/dispatches
