name: Publish signed marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xsec-marketplace-publish-main
  cancel-in-progress: false

jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install cryptography
      - name: Verify signing key matches the Desktop-pinned trust root
        env:
          XSEC_MARKETPLACE_SIGNING_KEY_B64: ${{ secrets.XSEC_MARKETPLACE_SIGNING_KEY_B64 }}
        run: python scripts/validate_market.py signing-key
      - name: Build signed immutable artifacts and metadata
        env:
          XSEC_MARKETPLACE_SIGNING_KEY_B64: ${{ secrets.XSEC_MARKETPLACE_SIGNING_KEY_B64 }}
        run: python scripts/build_market.py --clean
      - name: Verify signed metadata and published artifacts
        run: python scripts/validate_market.py published --root .
      - name: Commit published metadata when it changed
        run: |
          git add .agents/plugins/marketplace.json .agents/plugins/marketplace.json.sig plugins
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "xsec-marketplace[bot]"
          git config user.email "xsec-marketplace[bot]@users.noreply.github.com"
          git commit -m "chore: publish signed marketplace artifacts"
          git push
