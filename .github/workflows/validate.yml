name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install cryptography
      - name: Build a disposable unsigned marketplace
        run: python scripts/build_market.py --allow-unsigned --clean --output-root "$RUNNER_TEMP/xsec-marketplace-build"
      - name: Validate source manifests, deterministic artifacts and package safety
        run: python scripts/validate_market.py source --source-root . --built-root "$RUNNER_TEMP/xsec-marketplace-build"
      - name: Run marketplace gate tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
