name: Automatically finalize generated Marketplace PR

on:
  workflow_run:
    workflows: [Validate marketplace, Verify generated Marketplace publication merge]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  select-exact-generated-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'xsec-marketplace/')
    runs-on: ubuntu-latest
    outputs:
      pull_number: ${{ steps.pr.outputs.pull_number }}
      eligible: ${{ steps.pr.outputs.eligible }}
    steps:
      - name: Resolve one eligible exact generated Factory PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Finalizer trigger has an invalid head SHA." >&2; exit 1; }
          prs="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100")"
          matches="$(printf '%s' "$prs" | jq -cer --arg repository "$HEAD_REPOSITORY" --arg branch "$HEAD_BRANCH" --arg sha "$HEAD_SHA" '
            [.[][] | select(.head.repo.full_name == $repository and .head.sha == $sha and .head.ref == $branch)]
          ')"
          count="$(printf '%s' "$matches" | jq -er 'length')"
          if [ "$count" = "0" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$count" = "1" ] || { echo "expected one open exact-head generated PR" >&2; exit 1; }
          pull_number="$(printf '%s' "$matches" | jq -er '.[0].number')"
          head_branch="$(printf '%s' "$matches" | jq -er '.[0].head.ref')"
          [[ "$pull_number" =~ ^[1-9][0-9]*$ ]] || { echo "Generated PR number is invalid." >&2; exit 1; }
          case "$head_branch" in
            xsec-marketplace/publish-*|xsec-marketplace/batch-*|xsec-marketplace/default-set-*|xsec-marketplace/external-beta-*|xsec-marketplace/external-stable-*|xsec-marketplace/promote-stable-*|xsec-marketplace/stage-first-party-adoption-*|xsec-marketplace/adopt-first-party-*|xsec-marketplace/refresh-retained-sidecar-*|xsec-marketplace/layout-signatures-*) ;;
            *) echo "eligible=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          check_runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")"
          if ! printf '%s' "$check_runs" | jq -e '
            any(.check_runs[]?; .name == "source-gate" and .status == "completed" and .conclusion == "success")
          ' >/dev/null || ! printf '%s' "$check_runs" | jq -e '
            any(.check_runs[]?; .name == "source-freshness-gate" and .status == "completed" and .conclusion == "success")
          ' >/dev/null; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pull_number=$pull_number" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
