name: Finalize selected generated Marketplace PR

on:
  workflow_run:
    workflows: [Automatically finalize generated Marketplace PR]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: xsec-marketplace-final-merge-main
  cancel-in-progress: false

jobs:
  select-exact-generated-pr:
    # A `workflow_run` executes on protected default-branch configuration, but
    # its own head is `main`, not the upstream Factory candidate. The second
    # selector therefore reads live main-targeting PR metadata and accepts one
    # exact current-baseline candidate before production secrets and the
    # Finalizer App become available.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      pull_number: ${{ steps.pr.outputs.pull_number }}
      eligible: ${{ steps.pr.outputs.eligible }}
    steps:
      - name: Require the preceding unprivileged selector to have run
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/jobs?per_page=100")"
          printf '%s' "$jobs" | jq -e '
            any(.jobs[]?; .name == "select-exact-generated-pr" and .conclusion == "success")
          ' >/dev/null || {
            echo "The preceding Marketplace selector did not complete." >&2
            exit 1
          }
      - name: Resolve one exact ready current-baseline Factory PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$main_sha" =~ ^[a-f0-9]{40}$ ]] || { echo "Protected Factory main revision is invalid." >&2; exit 1; }
          prs="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100")"
          matches="$(printf '%s' "$prs" | jq -cer --arg repository "$GITHUB_REPOSITORY" --arg main_sha "$main_sha" '
            [.[][] | select(
              .head.repo.full_name == $repository
              and .base.sha == $main_sha
              and (.head.ref | test("^xsec-marketplace/(publish-|batch-|default-set-|external-beta-|external-stable-|promote-stable-|stage-first-party-adoption-|adopt-first-party-|refresh-retained-sidecar-|layout-signatures-)"))
            )]
          ')"
          count="$(printf '%s' "$matches" | jq -er 'length')"
          if [ "$count" = "0" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$count" = "1" ] || { echo "expected one exact current-baseline generated PR" >&2; exit 1; }
          pull_number="$(printf '%s' "$matches" | jq -er '.[0].number')"
          head_branch="$(printf '%s' "$matches" | jq -er '.[0].head.ref')"
          head_sha="$(printf '%s' "$matches" | jq -er '.[0].head.sha')"
          [[ "$pull_number" =~ ^[1-9][0-9]*$ ]] || { echo "Generated PR number is invalid." >&2; exit 1; }
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]] || { echo "Generated PR head revision is invalid." >&2; exit 1; }
          case "$head_branch" in
            xsec-marketplace/publish-*|xsec-marketplace/batch-*|xsec-marketplace/default-set-*|xsec-marketplace/external-beta-*|xsec-marketplace/external-stable-*|xsec-marketplace/promote-stable-*|xsec-marketplace/stage-first-party-adoption-*|xsec-marketplace/adopt-first-party-*|xsec-marketplace/refresh-retained-sidecar-*|xsec-marketplace/layout-signatures-*) ;;
            *) echo "Validated PR is not an automatically finalizable Factory branch." >&2; exit 1 ;;
          esac
          check_runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100")"
          if ! printf '%s' "$check_runs" | jq -e '
            any(.check_runs[]?; .name == "source-gate" and .status == "completed" and .conclusion == "success")
          ' >/dev/null || ! printf '%s' "$check_runs" | jq -e '
            any(.check_runs[]?; .name == "source-freshness-gate" and .status == "completed" and .conclusion == "success")
          ' >/dev/null; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The protected finalizer re-reads this state immediately before its
          # App-token merge. Keep the handoff unqueued until the exact
          # candidate has a trusted CodeRabbit completion and no open threads,
          # so source-gate completion alone cannot consume production
          # credentials for an unreviewed candidate.
          statuses="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/statuses?per_page=100")"
          # shellcheck disable=SC2016
          review_pages="$(gh api graphql --paginate --slurp -f query='query($owner:String!,$name:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){headRefOid reviews(first:100,after:$endCursor){nodes{author{login __typename} commit{oid} state submittedAt} pageInfo{hasNextPage endCursor}}}}}' \
            -F owner="${GITHUB_REPOSITORY_OWNER}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$pull_number" -F endCursor=null)"
          # shellcheck disable=SC2016
          coderabbit_comments="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${pull_number}/comments?per_page=100")"
          # shellcheck disable=SC2016
          thread_pages="$(gh api graphql --paginate --slurp -f query='query($owner:String!,$name:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){headRefOid reviewThreads(first:100,after:$endCursor){nodes{isResolved} pageInfo{hasNextPage endCursor}}}}}' \
            -F owner="${GITHUB_REPOSITORY_OWNER}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$pull_number" -F endCursor=null)"
          jq -ne --arg head "$head_sha" --argjson statuses "$statuses" --argjson reviews "$review_pages" --argjson comments "$coderabbit_comments" --argjson threads "$thread_pages" '
            ($statuses | type == "array" and length > 0)
            and all($statuses[]?; type == "array")
            and (
              [$statuses[][]
                | select(
                    .context == "CodeRabbit"
                    and (.created_at | type == "string")
                    and (.description | type == "string")
                  )
              ]
              | if length > 0 then (.[0].state == "success" and .[0].description == "Review completed") else false end
            )
            and ($reviews | type == "array" and length > 0)
            and all($reviews[]?; .data.repository.pullRequest.headRefOid == $head and (.data.repository.pullRequest.reviews.nodes | type == "array"))
            and ($reviews[-1].data.repository.pullRequest.reviews.pageInfo.hasNextPage == false)
            and (
              any($reviews[]?.data.repository.pullRequest.reviews.nodes[]?;
                .author.login == "coderabbitai"
                and .author.__typename == "Bot"
                and .commit.oid == $head
                and (.submittedAt | type == "string")
                and (.state == "COMMENTED" or .state == "APPROVED")
              )
              or (
                ($comments | type == "array" and length > 0)
                and all($comments[]?; type == "array")
                and any($comments[][];
                  .user.login == "coderabbitai[bot]"
                  and .user.type == "Bot"
                  and (.body | type == "string")
                  and (.body | contains($head))
                  and (.body | contains("<!-- recent_review_end -->"))
                )
              )
            )
            and ($threads | type == "array" and length > 0)
            and all($threads[]?; .data.repository.pullRequest.headRefOid == $head and (.data.repository.pullRequest.reviewThreads.nodes | type == "array"))
            and ($threads[-1].data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false)
            and all($threads[]?.data.repository.pullRequest.reviewThreads.nodes[]?; .isResolved == true)
          ' >/dev/null || {
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "pull_number=$pull_number" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
  final-revalidate-and-merge:
    needs: select-exact-generated-pr
    if: ${{ !cancelled() && needs.select-exact-generated-pr.result == 'success' && needs.select-exact-generated-pr.outputs.eligible == 'true' }}
    uses: ./.github/workflows/final-merge-generated-marketplace-pr.yml
    with:
      pull_number: ${{ needs.select-exact-generated-pr.outputs.pull_number }}
    secrets: inherit
