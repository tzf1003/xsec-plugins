name: Enforce Factory protected-main merge policy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xsec-marketplace-main-protection
  cancel-in-progress: false

jobs:
  enforce:
    # This is deliberately manual and protected: changing branch protection is
    # a repository-administration operation, not a side effect of publishing.
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require the repository-administration credential
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_ADMIN_TOKEN }}
          FINALIZER_APP_ID: ${{ secrets.XSEC_MARKETPLACE_FINALIZER_APP_ID }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || {
            echo "XSEC_MARKETPLACE_ADMIN_TOKEN is required to change main branch protection." >&2
            exit 1
          }
          [[ "$FINALIZER_APP_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "XSEC_MARKETPLACE_FINALIZER_APP_ID must contain the positive decimal GitHub App integration ID for the exact-head finalizer." >&2
            exit 1
          }
          environment_policy="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          printf '%s' "$environment_policy" | jq -e '
            .can_admins_bypass == false
            and .deployment_branch_policy.protected_branches == true
            and .deployment_branch_policy.custom_branch_policies == false
            and any(.protection_rules[]?; .type == "branch_policy")
            and ([.protection_rules[]? | select(.type == "required_reviewers")] | length == 0)
          ' >/dev/null || {
            echo "production must accept protected branches only, omit required reviewers, and forbid administrator bypass before Factory protection is enabled." >&2
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/main
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Create or verify the exact-head finalizer Ruleset before changing classic protection
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_ADMIN_TOKEN }}
          FINALIZER_APP_ID: ${{ secrets.XSEC_MARKETPLACE_FINALIZER_APP_ID }}
        run: |
          set -euo pipefail
          rulesets="$RUNNER_TEMP/factory-rulesets.json"
          plan="$RUNNER_TEMP/factory-finalizer-ruleset-plan.json"
          payload="$RUNNER_TEMP/factory-finalizer-ruleset-payload.json"
          current="$RUNNER_TEMP/factory-finalizer-ruleset-current.json"
          verified="$RUNNER_TEMP/factory-finalizer-ruleset-verified.json"
          post_rulesets="$RUNNER_TEMP/factory-rulesets-after.json"
          post_plan="$RUNNER_TEMP/factory-finalizer-ruleset-after-plan.json"
          # The Rulesets API is paginated.  Flatten every response page before
          # planning so an existing managed Ruleset beyond the first page
          # cannot be mistaken for an absent one and recreated.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/rulesets?per_page=100" \
            | jq -e '[.[][]]' > "$rulesets"
          python scripts/factory_finalizer_ruleset_policy.py \
            --rulesets "$rulesets" \
            --finalizer-app-id "$FINALIZER_APP_ID" \
            --output "$plan"
          jq -e '.ruleset' "$plan" > "$payload"
          action="$(jq -er .action "$plan")"
          case "$action" in
            create)
              gh api --method POST "repos/${GITHUB_REPOSITORY}/rulesets" --input "$payload" > "$verified"
              ;;
            update)
              ruleset_id="$(jq -er .ruleset_id "$plan")"
              [[ "$ruleset_id" =~ ^[1-9][0-9]*$ ]] || {
                echo "Ruleset plan returned an invalid update identifier." >&2
                exit 1
              }
              # A concurrent console edit must not be overwritten. Re-fetch
              # and validate the sole managed Ruleset immediately before PUT.
              gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" > "$current"
              python scripts/factory_finalizer_ruleset_policy.py \
                --ruleset "$current" \
                --finalizer-app-id "$FINALIZER_APP_ID" \
                --verify
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" --input "$payload" > "$verified"
              ;;
            *)
              echo "Ruleset plan returned an unsafe action." >&2
              exit 1
              ;;
          esac
          python scripts/factory_finalizer_ruleset_policy.py \
            --ruleset "$verified" \
            --finalizer-app-id "$FINALIZER_APP_ID" \
            --verify
          # Re-list after POST/PUT so a same-name concurrent configuration
          # cannot leave two finalizer Rulesets while classic protection is
          # being changed. The policy deliberately ignores every other name.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/rulesets?per_page=100" \
            | jq -e '[.[][]]' > "$post_rulesets"
          python scripts/factory_finalizer_ruleset_policy.py \
            --rulesets "$post_rulesets" \
            --finalizer-app-id "$FINALIZER_APP_ID" \
            --output "$post_plan"
          [ "$(jq -er .action "$post_plan")" = update ] \
            && [ "$(jq -er .ruleset_id "$post_plan")" = "$(jq -er .id "$verified")" ] || {
              echo "Exact-head finalizer Ruleset did not remain the unique managed Ruleset." >&2
              exit 1
            }
          echo "Exact-head finalizer Ruleset is active and verified."
      - name: Strengthen classic main protection after finalizer Ruleset verification
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/main-protection-current.json"
          desired="$RUNNER_TEMP/main-protection-desired.json"
          verified="$RUNNER_TEMP/main-protection-verified.json"
          gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" > "$current"
          python scripts/factory_main_protection_policy.py --input "$current" --output "$desired"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/branches/main/protection" --input "$desired" > "$verified"
          python scripts/factory_main_protection_policy.py --input "$verified" --verify
          echo "Classic Factory main protection is active: strict GitHub-Actions source gate and admin enforcement. The exact-head finalizer gate is enforced by its verified Ruleset."
