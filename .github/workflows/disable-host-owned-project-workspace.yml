name: Retire host-owned project workspace from Marketplace

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: xsec-marketplace-disable-host-owned-project-workspace
  cancel-in-progress: false

jobs:
  create-signed-withdrawal-candidate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Identify the one host-owned project package transition
        id: transition
        run: |
          set -euo pipefail
          registry=".xsec-factory/official-registry.json"
          marketplace=".agents/plugins/marketplace.json"
          status="$(jq -er '.plugins | [.[] | select(.pluginId == "com.xsec.project-workspace")] | if length == 1 then .[0].status else error("project workspace registry entry is ambiguous") end' "$registry")"
          case "$status" in
            disabled) echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            active) ;;
            *) echo "Project workspace has an invalid Registry lifecycle state." >&2; exit 1 ;;
          esac
          jq -e '[.plugins[] | select(.name == "com.xsec.project-workspace")] | length == 1' "$marketplace" >/dev/null || {
            echo "Active project workspace must have exactly one Marketplace entry." >&2
            exit 1
          }
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Create the immutable host-routing withdrawal
        if: ${{ steps.transition.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          registry=".xsec-factory/official-registry.json"
          marketplace=".agents/plugins/marketplace.json"
          jq '(.plugins[] | select(.pluginId == "com.xsec.project-workspace")).status = "disabled"' "$registry" > "$RUNNER_TEMP/official-registry.json"
          mv "$RUNNER_TEMP/official-registry.json" "$registry"
          jq '.plugins |= map(select(.name != "com.xsec.project-workspace"))' "$marketplace" > "$RUNNER_TEMP/marketplace.json"
          mv "$RUNNER_TEMP/marketplace.json" "$marketplace"
          rm -f -- "${marketplace}.sig.jws.json"
      - name: Validate and KMS-sign only the new active Marketplace index
        if: ${{ steps.transition.outputs.publish == 'true' }}
        env:
          XSEC_MARKETPLACE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/validate_market.py source --source-root . --built-root .
          python scripts/external_source_factory.py validate
          python scripts/kms_marketplace_publisher.py --root . --marketplace-index
          python scripts/kms_marketplace_publisher.py --root . --marketplace-index --validate-only
      - name: Open the signed host-routing withdrawal PR
        if: ${{ steps.transition.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "XSEC_MARKETPLACE_PUBLISH_TOKEN is not configured." >&2; exit 1; }
          git add -- .xsec-factory/official-registry.json .agents/plugins/marketplace.json .agents/plugins/marketplace.json.sig.jws.json
          git diff --cached --quiet && { echo "Host-routing withdrawal did not create a candidate." >&2; exit 1; }
          git config user.name "xsec-marketplace[bot]"
          git config user.email "xsec-marketplace[bot]@users.noreply.github.com"
          git commit -m "chore: retire project workspace Marketplace package"
          branch="xsec-marketplace/disable-host-owned-project-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: retire project workspace Marketplace package" --body "Generated host-routing withdrawal. It disables the retained project-workspace Registry row, removes only its default Marketplace entry, and KMS-signs the replacement index. Snapshots, release history, adoption proof, and historical sidecars remain unchanged."
