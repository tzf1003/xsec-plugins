name: Final merge reviewed Marketplace publication PR

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: Open same-repository xsec-marketplace publication PR to revalidate and merge
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: xsec-marketplace-final-merge-main
  cancel-in-progress: false

jobs:
  revalidate-and-merge:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require protected main and the Factory publication credential
        env:
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] && [ "$REF_PROTECTED" = "true" ] || {
            echo "Final Marketplace merge requires a protected main dispatch." >&2
            exit 1
          }
          [ -n "$GH_TOKEN" ] || { echo "The Factory publication credential is required." >&2; exit 1; }
          [[ "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "pull_number must be a positive decimal." >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main
          token: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read the live PR and fetch its exact immutable head without executing PR code
        id: pr
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_NUMBER}")"
          state="$(printf '%s' "$pr" | jq -er .state)"
          base_ref="$(printf '%s' "$pr" | jq -er .base.ref)"
          base_sha="$(printf '%s' "$pr" | jq -er .base.sha)"
          head_repository="$(printf '%s' "$pr" | jq -er .head.repo.full_name)"
          head_ref="$(printf '%s' "$pr" | jq -er .head.ref)"
          head_sha="$(printf '%s' "$pr" | jq -er .head.sha)"
          [ "$state" = "open" ] && [ "$base_ref" = "main" ] && [ "$head_repository" = "$GITHUB_REPOSITORY" ] || {
            echo "Final gate accepts only an open same-repository PR targeting main." >&2
            exit 1
          }
          case "$head_ref" in
            xsec-marketplace/publish-*|xsec-marketplace/external-beta-*|xsec-marketplace/external-stable-*|xsec-marketplace/promote-stable-*) ;;
            *) echo "Final gate accepts only protected Factory publication branches." >&2; exit 1 ;;
          esac
          [[ "$base_sha" =~ ^[a-f0-9]{40}$ && "$head_sha" =~ ^[a-f0-9]{40}$ ]] || {
            echo "Live PR contains malformed Git revisions." >&2
            exit 1
          }
          [ "$base_sha" = "$(git rev-parse HEAD)" ] || {
            echo "Main advanced since this PR was last based; update/review it before final merge." >&2
            exit 1
          }
          git fetch --no-tags origin "pull/${PULL_NUMBER}/head:refs/xsec-final-gate/${PULL_NUMBER}"
          [ "$(git rev-parse "refs/xsec-final-gate/${PULL_NUMBER}")" = "$head_sha" ] || {
            echo "Fetched PR head does not equal GitHub's live head." >&2
            exit 1
          }
          git merge-base --is-ancestor "$base_sha" "$head_sha" || {
            echo "Factory PR no longer descends from its current main base." >&2
            exit 1
          }
          git worktree add --detach "$RUNNER_TEMP/factory-publication" "$head_sha"
          echo "number=$PULL_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
      - name: Re-pend the exact head for the full protected revalidation interval
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending -f context=factory-final-merge-gate \
            -f description='Protected final source/Codex revalidation is running.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - name: Revalidate the exact publication diff, every KMS sidecar, and live external heads
        env:
          BEFORE: ${{ steps.pr.outputs.base_sha }}
          AFTER: ${{ steps.pr.outputs.head_sha }}
          CANDIDATE: ${{ runner.temp }}/factory-publication
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          result="$(python scripts/verify_merged_stable_promotion.py --root "$CANDIDATE" --before "$BEFORE" --after "$AFTER" --classify)"
          kind="$(printf '%s' "$result" | jq -er .kind)"
          if [ "$kind" = "stable-maintenance" ]; then
            case "$HEAD_REF" in
              xsec-marketplace/external-stable-*) ;;
              *) echo "Only external Stable completion branches may use the no-pointer maintenance shape." >&2; exit 1 ;;
            esac
            python scripts/external_source_factory.py --root "$CANDIDATE" validate
          elif [ "$kind" != "beta" ] && [ "$kind" != "stable" ]; then
            echo "Final merge gate accepts only a signed Beta or Stable release transition." >&2
            exit 1
          fi
          verification="$(python scripts/kms_marketplace_publisher.py --root "$CANDIDATE" --verify-active-marketplace-signatures)"
          source_sha="$(printf '%s' "$verification" | jq -er .source_revision)"
          git -C "$CANDIDATE" merge-base --is-ancestor "$source_sha" "$AFTER" || {
            echo "KMS source revision is not retained by the exact PR head." >&2
            exit 1
          }
          printf '%s\n' "$result" > "$RUNNER_TEMP/factory-publication.json"
          while IFS= read -r source; do
            repository="$(printf '%s' "$source" | jq -er .repository)"
            ref="$(printf '%s' "$source" | jq -er .ref)"
            expected_sha="$(printf '%s' "$source" | jq -er .sha)"
            actual_sha="$(env -u GIT_CONFIG -u GIT_CONFIG_COUNT -u GIT_CONFIG_PARAMETERS \
              -u GIT_SSL_NO_VERIFY -u GIT_HTTP_PROXY -u HTTP_PROXY -u http_proxy \
              -u HTTPS_PROXY -u https_proxy -u GIT_EXEC_PATH \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ALLOW_PROTOCOL=https \
              git -c credential.helper= -c http.followRedirects=false \
              ls-remote "https://github.com/${repository}.git" "$ref" | awk 'NR == 1 { print $1 }')"
            [ "$actual_sha" = "$expected_sha" ] || {
              echo "Registered ${repository} ${ref} advanced; regenerate, re-sign, and re-review the PR." >&2
              exit 1
            }
          done < <(printf '%s' "$result" | jq -rc '.promotions[] | select(.source != null) | .source')
      - name: Require a current source gate, Codex review, and every Codex thread resolved
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
          PULL_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/runs?head_sha=${HEAD_SHA}&event=workflow_dispatch&per_page=100")"
          printf '%s' "$runs" | jq -e 'any(.workflow_runs[]; .status == "completed" and .conclusion == "success")' >/dev/null || {
            echo "The exact PR head has no successful Factory source gate." >&2
            exit 1
          }
          reviews="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_NUMBER}/reviews?per_page=100")"
          printf '%s' "$reviews" | jq -e --arg head "$HEAD_SHA" 'any(.[]; (.user.login == "chatgpt-codex-connector[bot]" or .user.login == "chatgpt-codex-connector") and .commit_id == $head)' >/dev/null || {
            echo "The exact PR head has no completed Codex review." >&2
            exit 1
          }
          cursor=""
          while :; do
            query='query($owner:String!,$repository:String!,$number:Int!,$cursor:String){repository(owner:$owner,name:$repository){pullRequest(number:$number){reviewThreads(first:100,after:$cursor){nodes{isResolved comments(first:1){nodes{author{login}}}} pageInfo{hasNextPage endCursor}}}}}'
            page="$(gh api graphql -f query="$query" -F owner="${GITHUB_REPOSITORY%%/*}" -F repository="${GITHUB_REPOSITORY##*/}" -F number="$PULL_NUMBER" -f cursor="$cursor")"
            printf '%s' "$page" | jq -e '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false) | .comments.nodes[]?.author.login] | any(. == "chatgpt-codex-connector" or . == "chatgpt-codex-connector[bot]") | not' >/dev/null || {
              echo "The PR still has an unresolved Codex review thread." >&2
              exit 1
            }
            has_next="$(printf '%s' "$page" | jq -er .data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage)"
            [ "$has_next" = "true" ] || break
            cursor="$(printf '%s' "$page" | jq -er .data.repository.pullRequest.reviewThreads.pageInfo.endCursor)"
            [ -n "$cursor" ] || { echo "GitHub returned a paginated review thread page without a cursor." >&2; exit 1; }
          done
      - name: Recheck the live PR/source boundary, merge its exact head, and re-pend on failure
        env:
          STATUS_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
          PULL_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          CANDIDATE: ${{ runner.temp }}/factory-publication
        run: |
          set -euo pipefail
          pending() {
            GH_TOKEN="$STATUS_TOKEN" gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=pending -f context=factory-final-merge-gate \
              -f description='Final merge did not complete; re-run protected revalidation.' >/dev/null
          }
          live_pr="$(GH_TOKEN="$MERGE_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_NUMBER}")"
          [ "$(printf '%s' "$live_pr" | jq -er .state)" = "open" ] \
            && [ "$(printf '%s' "$live_pr" | jq -er .base.ref)" = "main" ] \
            && [ "$(printf '%s' "$live_pr" | jq -er .base.sha)" = "$BASE_SHA" ] \
            && [ "$(printf '%s' "$live_pr" | jq -er .head.sha)" = "$HEAD_SHA" ] || {
              echo "PR head/base changed while final revalidation ran; it remains pending." >&2
              exit 1
            }
          [ "$(GH_TOKEN="$MERGE_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA" ] || {
            echo "Protected main advanced while final revalidation ran; it remains pending." >&2
            exit 1
          }
          # Re-read each external ref immediately before releasing the required
          # check. The subsequent expected-head merge gives this check and the
          # merge one indivisible candidate identity.
          while IFS= read -r source; do
            repository="$(printf '%s' "$source" | jq -er .repository)"
            ref="$(printf '%s' "$source" | jq -er .ref)"
            expected_sha="$(printf '%s' "$source" | jq -er .sha)"
            actual_sha="$(env -u GIT_CONFIG -u GIT_CONFIG_COUNT -u GIT_CONFIG_PARAMETERS \
              -u GIT_SSL_NO_VERIFY -u GIT_HTTP_PROXY -u HTTP_PROXY -u http_proxy \
              -u HTTPS_PROXY -u https_proxy -u GIT_EXEC_PATH \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ALLOW_PROTOCOL=https \
              git -c credential.helper= -c http.followRedirects=false \
              ls-remote "https://github.com/${repository}.git" "$ref" | awk 'NR == 1 { print $1 }')"
            [ "$actual_sha" = "$expected_sha" ] || {
              echo "Registered ${repository} ${ref} advanced while final revalidation ran; it remains pending." >&2
              exit 1
            }
          done < <(jq -rc '.promotions[] | select(.source != null) | .source' "$RUNNER_TEMP/factory-publication.json")
          GH_TOKEN="$STATUS_TOKEN" gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context=factory-final-merge-gate \
            -f description='Protected final revalidation passed; merging this exact head now.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          if ! GH_TOKEN="$MERGE_TOKEN" gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PULL_NUMBER}/merge" \
            -f sha="$HEAD_SHA" -f merge_method=squash -f commit_title='chore: merge reviewed Marketplace publication' >/dev/null; then
            pending
            echo "GitHub did not merge the exact revalidated PR head; final status was restored to pending." >&2
            exit 1
          fi
