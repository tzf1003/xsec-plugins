name: Promote immutable marketplace release to stable

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: Marketplace plugin ID to promote or roll back
        required: true
        type: string
      release_id:
        description: Existing immutable releaseId to select for stable
        required: true
        type: string

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  # Stable promotion and beta publication both regenerate the signed market
  # index and merge a generated PR. They must share one queue so neither run
  # can publish against a stale immutable release list or channel pointer.
  group: xsec-marketplace-publish-main
  cancel-in-progress: false

jobs:
  enforce-promotion-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require protected main for manual stable promotion
        env:
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [ "$REF" != "refs/heads/main" ] || [ "$REF_PROTECTED" != "true" ]; then
            echo "Stable promotion requires a manual run from protected refs/heads/main." >&2
            exit 1
          fi
  promote-and-publish:
    needs: enforce-promotion-ref
    if: ${{ needs.enforce-promotion-ref.result == 'success' && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require the protected marketplace publication token before checkout or KMS
        env:
          XSEC_MARKETPLACE_PUBLISH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$XSEC_MARKETPLACE_PUBLISH_TOKEN" ]; then
            echo "The protected marketplace publication token is required before checkout or KMS signing." >&2
            exit 1
          fi
      # A manual promotion can wait behind Beta publication. Resolve main
      # after it obtains the shared slot so promotion sees the release list
      # that the preceding run actually published.
      - name: Check out current protected main after acquiring the publication slot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main
          token: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
      - name: Record the current protected source revision
        id: current-main
        run: |
          source_revision="$(git rev-parse HEAD)"
          [ "$source_revision" = "$(git rev-parse origin/main)" ] || { echo "Current checkout is not protected main." >&2; exit 1; }
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"
      - name: Refuse to sign while any generated Factory PR awaits review
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          pending="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" |
              jq -r --arg repository "$GITHUB_REPOSITORY" '
                .[] |
                select(.head.repo.full_name == $repository) |
                .head.ref |
                select(startswith("xsec-marketplace/"))
              '
          )"
          if [ -n "$pending" ]; then
            printf 'A generated Marketplace PR is still awaiting source/Codex review and protected merge:\n%s\n' "$pending" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Keep registered external plugins on the signed Factory bridge
        env:
          PLUGIN_ID: ${{ inputs.plugin_id }}
        run: python scripts/external_source_factory.py reject-legacy-stable --plugin-id "$PLUGIN_ID"
      - name: Move only the stable channel pointer
        id: promote
        env:
          PLUGIN_ID: ${{ inputs.plugin_id }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python scripts/promote_release.py --root . --plugin-id "$PLUGIN_ID" --release-id "$RELEASE_ID"
          if git diff --quiet -- .xsec-factory/snapshots; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the selected immutable release without rebuilding artifacts
        if: ${{ steps.promote.outputs.changed == 'true' }}
        run: |
          python scripts/validate_market.py source --source-root . --built-root .
          python scripts/external_source_factory.py validate
      - name: Request KMS sidecars through the production Cloud broker
        if: ${{ steps.promote.outputs.changed == 'true' }}
        env:
          XSEC_MARKETPLACE_SOURCE_REVISION: ${{ steps.current-main.outputs.source_revision }}
        run: python scripts/kms_marketplace_publisher.py --root . --exclude-official-status
      - name: Gate the KMS sidecar protocol before publishing
        if: ${{ steps.promote.outputs.changed == 'true' }}
        env:
          XSEC_MARKETPLACE_SOURCE_REVISION: ${{ steps.current-main.outputs.source_revision }}
        run: python scripts/kms_marketplace_publisher.py --root . --exclude-official-status --validate-only
      - name: Publish the stable pointer through a protected pull request
        id: publish
        if: ${{ steps.promote.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          git add -A -- .agents/plugins .xsec-factory
          git diff --cached --quiet && { echo "No stable pointer update to publish."; exit 1; }
          git config user.name "xsec-marketplace[bot]"
          git config user.email "xsec-marketplace[bot]@users.noreply.github.com"
          git commit -m "chore: promote marketplace stable release"
          generated_revision="$(git rev-parse HEAD)"
          branch="xsec-marketplace/promote-stable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git push --set-upstream origin "$branch"
          pull_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: promote marketplace stable release" \
            --body "Generated by protected workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. It changes only channels.stable.releaseId and reuses the existing artifact digests. The source gate and explicit Codex review are required; this workflow does not merge the PR.")"
          pull_number="$(gh pr view "$pull_url" --json number --jq .number)"
          gh workflow run validate.yml --ref "$branch"
          deadline="$((SECONDS + 900))"
          while :; do
            source_gate="$(gh run list \
              --workflow validate.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,status,conclusion \
              | jq -rc --arg revision "$generated_revision" '.[] | select(.headSha == $revision) | @base64' \
              | head -n 1)"
            if [ -n "$source_gate" ]; then
              source_gate_json="$(printf '%s' "$source_gate" | base64 --decode)"
              source_gate_status="$(printf '%s' "$source_gate_json" | jq -r .status)"
              source_gate_conclusion="$(printf '%s' "$source_gate_json" | jq -r .conclusion)"
              if [ "$source_gate_status" = "completed" ]; then
                [ "$source_gate_conclusion" = "success" ] || { echo "The generated marketplace source gate did not succeed." >&2; exit 1; }
                break
              fi
            fi
            [ "$SECONDS" -lt "$deadline" ] || { echo "Timed out waiting for the generated marketplace source gate." >&2; exit 1; }
            sleep 5
          done
          review_body="@codex review"$'\n\n'"The protected Factory source gate passed for ${generated_revision}. Review the exact Beta release, Stable pointer, immutable artifacts, release index, and KMS sidecars before a protected merge. This workflow intentionally does not merge this PR or dispatch Desktop smoke until that merge occurs."
          gh pr comment "$pull_number" --body "$review_body"
          {
            echo "## Marketplace Stable promotion PR awaiting review"
            echo
            echo "${pull_url}"
            echo
            echo "The source gate passed. Codex review and a protected merge are required before this Stable pointer may reach Desktop smoke."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "pending_review=true" >> "$GITHUB_OUTPUT"
