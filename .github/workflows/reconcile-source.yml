                  # created its PR before the run completed. Stop receipt
                  # polling and let the ordinary bounded candidate poll expose
                  # an unexpected missing PR as a failure.
                  PUBLISHER_DISPATCH_EPOCH=""
                fi
              fi
              [ "$SECONDS" -lt "$deadline" ] || { echo "Timed out waiting for the generated current Beta candidate." >&2; exit 1; }
              sleep 5
              continue
            fi
            IFS='|' read -r number branch head_sha generation_base candidate_base <<< "${matches[0]}"
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" | jq -cer '{branch:.head.ref,head:.head.sha,state:.state}')"
            [ "$(printf '%s' "$latest" | jq -er .state)" = "open" ] \
              && [ "$(printf '%s' "$latest" | jq -er .branch)" = "$branch" ] \
              && [ "$(printf '%s' "$latest" | jq -er .head)" = "$head_sha" ] || continue
            candidate_root="$(mktemp -d "$RUNNER_TEMP/xsec-status-sign.XXXXXX")"
            cleanup_signed_candidate() { git worktree remove --force "$candidate_root" >/dev/null 2>&1 || true; rm -rf -- "$candidate_root"; }
            git worktree add --detach "$candidate_root" "$head_sha" >/dev/null
            status_path="$candidate_root/.xsec-factory/official-status/${PLUGIN_ID}.json"
            status_proof=".xsec-factory/official-status-proofs/${PLUGIN_ID}.json"
            if python scripts/kms_marketplace_publisher.py --root "$candidate_root" --verify-active-marketplace-signatures >/dev/null 2>&1; then
              signed_head="$head_sha"
            else
              # Re-read the exact registered source heads after all candidate
              # validation and before KMS. A changed source is regenerated by
              # its new signed webhook delivery, never retroactively signed.
              current_beta="$(git -c credential.helper= -c http.followRedirects=false ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "$SOURCE_BETA_REF" | awk 'NR == 1 { print $1 }')"
              [ "$current_beta" = "$beta_sha" ] || { echo "Registered Beta advanced before status signing." >&2; exit 1; }
              current_main="$(git -c credential.helper= -c http.followRedirects=false ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "$SOURCE_STABLE_REF" | awk 'NR == 1 { print $1 }')"
              [[ "$current_main" =~ ^[a-f0-9]{40}$ ]] || { echo "Cannot resolve the registered main source head before status signing." >&2; exit 1; }
              if [ "$CHANNEL" = "stable" ]; then
                [ "$current_main" = "$SOURCE_SHA" ] || { echo "Registered main advanced before status signing." >&2; exit 1; }
              fi
              # The status document is deliberately unsigned on the generated
              # branch. Recompute its decision from the current allowlisted
              # main checkout before KMS binds it; a candidate-controlled
              # waiting_for_smoke/mainGateSha tuple is never authority.
              source_main_root="$(mktemp -d "$RUNNER_TEMP/xsec-status-main.XXXXXX")"
              cleanup_main_source() { rm -rf -- "$source_main_root"; }
              git -c init.templateDir= -c core.hooksPath=/dev/null init --quiet "$source_main_root"
              env -u GIT_CONFIG -u GIT_CONFIG_COUNT -u GIT_CONFIG_PARAMETERS \
                -u GIT_SSL_NO_VERIFY -u GIT_HTTP_PROXY -u HTTP_PROXY -u http_proxy \
                -u HTTPS_PROXY -u https_proxy -u GIT_EXEC_PATH \
                GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
                GIT_ALLOW_PROTOCOL=https GIT_TERMINAL_PROMPT=0 \
                git -C "$source_main_root" \
                  -c credential.helper= \
                  -c core.hooksPath=/dev/null \
                  -c core.autocrlf=false \
                  -c http.sslVerify=true \
                  -c http.followRedirects=false \
                  -c protocol.allow=never \
                  -c protocol.https.allow=always \
                  fetch --no-tags "https://github.com/${SOURCE_REPOSITORY}.git" \
                  "$SOURCE_STABLE_REF:refs/remotes/xsec-reconcile/registered-main"
              [ "$(git -C "$source_main_root" rev-parse refs/remotes/xsec-reconcile/registered-main)" = "$current_main" ] || {
                echo "The sealed main checkout did not retain the registered source head." >&2
                exit 1
              }
              env -u GIT_CONFIG -u GIT_CONFIG_COUNT -u GIT_CONFIG_PARAMETERS \
                GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
                git -C "$source_main_root" -c core.hooksPath=/dev/null -c core.autocrlf=false \
                  checkout --detach --quiet refs/remotes/xsec-reconcile/registered-main
              rebuilt_gate="$(python scripts/external_source_factory.py --root "$candidate_root" check-main-rebuild \
                --plugin-id "$PLUGIN_ID" --source-root "$source_main_root")"
              expected_state="$(printf '%s' "$rebuilt_gate" | jq -er .state)"
              expected_release="$(printf '%s' "$rebuilt_gate" | jq -er .beta_release_id)"
              candidate_gate="$(jq -cer '{state:.publication.state,main_gate_sha:.source.mainGateSha,beta_release_id:.release.betaReleaseId}' "$status_path")"
              [ "$(printf '%s' "$candidate_gate" | jq -er .main_gate_sha)" = "$current_main" ] \
                && [ "$(printf '%s' "$candidate_gate" | jq -er .state)" = "$expected_state" ] \
                && [ "$(printf '%s' "$candidate_gate" | jq -er .beta_release_id)" = "$expected_release" ] || {
                  echo "Candidate status does not match the recomputed registered main gate." >&2
                  exit 1
                }
              cleanup_main_source
              XSEC_MARKETPLACE_SOURCE_REVISION="$generation_base" \
                python scripts/kms_marketplace_publisher.py --root "$candidate_root" --official-status-plugin-id "$PLUGIN_ID"
              git -C "$candidate_root" diff --quiet -- .xsec-factory/official-status || {
                echo "Status signer changed the status document instead of only its proof." >&2
                exit 1
              }
              git -C "$candidate_root" add -- "$status_proof"
              changed="$(git -C "$candidate_root" diff --cached --name-only --no-renames)"
              [ "$changed" = "$status_proof" ] || { echo "Status signer staged an unauthorized path." >&2; exit 1; }
              git -C "$candidate_root" config user.name "xsec-marketplace[bot]"
              git -C "$candidate_root" config user.email "xsec-marketplace[bot]@users.noreply.github.com"
              git -C "$candidate_root" commit -m "chore: authenticate official Factory status"
              signed_head="$(git -C "$candidate_root" rev-parse HEAD)"
            fi
            signed_change="$(python scripts/verify_merged_stable_promotion.py --root "$candidate_root" --before "$candidate_base" --after "$signed_head" --classify)"
            [ "$(printf '%s' "$signed_change" | jq -er '.promotions | if type == "array" and length == 1 then .[0].plugin_id else error("candidate no longer authenticates one plugin") end')" = "$PLUGIN_ID" ] || {
              echo "Signed candidate does not authenticate the requested plugin." >&2
              exit 1
            }
            final_verification="$(python scripts/kms_marketplace_publisher.py --root "$candidate_root" --verify-active-marketplace-signatures)"
            [ "$(printf '%s' "$final_verification" | jq -er .source_revision)" = "$generation_base" ] || {
              echo "Status proof did not retain the candidate KMS generation revision." >&2
              exit 1
            }
            python scripts/external_source_factory.py --root "$candidate_root" validate
            if [ "$signed_head" != "$head_sha" ]; then
              git -C "$candidate_root" push origin "HEAD:refs/heads/${branch}"
            fi
            cleanup_signed_candidate
            gh workflow run validate.yml --ref "$branch"
            gate_deadline="$((SECONDS + 900))"
            while :; do
              source_gate="$(gh run list --workflow validate.yml --branch "$branch" --event workflow_dispatch --limit 20 --json headSha,status,conclusion | jq -rc --arg revision "$signed_head" '.[] | select(.headSha == $revision) | @base64' | head -n 1)"
              if [ -n "$source_gate" ]; then
                source_gate_json="$(printf '%s' "$source_gate" | base64 --decode)"
                [ "$(printf '%s' "$source_gate_json" | jq -r .status)" = "completed" ] || { sleep 5; continue; }
                [ "$(printf '%s' "$source_gate_json" | jq -r .conclusion)" = "success" ] || { echo "The signed candidate source gate failed." >&2; exit 1; }
                break
              fi
              [ "$SECONDS" -lt "$gate_deadline" ] || { echo "Timed out waiting for the signed candidate source gate." >&2; exit 1; }
              sleep 5
            done
            review_body="@codex review"$'\n\n'"Protected reconcile-source authenticated the exact generated status proof at ${signed_head}, then the Factory source gate passed. Review the immutable artifacts, provenance, KMS sidecars, and status proof before protected merge. This workflow never merges the PR or dispatches Desktop smoke."
            gh pr comment "$number" --body "$review_body"
            echo "Authenticated generated candidate #${number}; source gate passed and Codex review was requested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done
  reconcile-smoke:
    needs: enforce-dispatch
    if: ${{ inputs.trigger_kind == 'smoke_callback' }}
    uses: ./.github/workflows/reconcile-smoke.yml
    with:
      trigger_kind: ${{ inputs.trigger_kind }}
      delivery_key: ${{ inputs.delivery_key }}
      plugin_id: ${{ inputs.plugin_id }}
      source_repository: ${{ inputs.source_repository }}
      source_ref: ${{ inputs.source_ref }}
      source_sha: ${{ inputs.source_sha }}
      marketplace_revision: ${{ inputs.marketplace_revision }}
      channel: ${{ inputs.channel }}
      smoke_workflow_run_id: ${{ inputs.smoke_workflow_run_id }}
      smoke_workflow_run_attempt: ${{ inputs.smoke_workflow_run_attempt }}
  authenticate-smoke-candidates:
    # reconcile-smoke only dispatches immutable Stable work.  This caller
    # retains the reconcile-source workflow identity required by Cloud before
    # it may attach each terminal status proof to the generated PR.
    needs: [enforce-dispatch, reconcile-smoke]
    if: >-
      ${{ always() && inputs.trigger_kind == 'smoke_callback' && needs['enforce-dispatch'].result == 'success' &&
          needs['reconcile-smoke'].result == 'success' && needs['reconcile-smoke'].outputs.stable_requests != '' &&
          needs['reconcile-smoke'].outputs.stable_requests != '0' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Authenticate, sign, and source-gate every exact smoke completion candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REQUESTS: ${{ needs['reconcile-smoke'].outputs.stable_requests }}
          MARKETPLACE_REVISION: ${{ inputs.marketplace_revision }}
          SMOKE_RUN_ID: ${{ inputs.smoke_workflow_run_id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REQUESTS" =~ ^[1-9][0-9]*$ ]] || { echo "Smoke reconciliation did not return a canonical request count." >&2; exit 1; }
          smoke_url="https://github.com/tzf1003/xSecDesktop/actions/runs/${SMOKE_RUN_ID}"
          deadline="$((SECONDS + 900))"
          completed="|"
          completed_count=0
          while [ "$completed_count" -lt "$EXPECTED_REQUESTS" ]; do
            candidates="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" | jq -cer --arg repository "$GITHUB_REPOSITORY" '
              [ .[][]
                | select(.head.repo.full_name == $repository)
                | select(.head.ref | test("^xsec-marketplace/external-stable-[0-9]+-[0-9]+$"))
              ]
            ')"
            progressed=false
            while IFS= read -r candidate; do
              number="$(printf '%s' "$candidate" | jq -er .number)"
              case "$completed" in *"|${number}|"*) continue ;; esac
              branch="$(printf '%s' "$candidate" | jq -er .head.ref)"
              head_sha="$(printf '%s' "$candidate" | jq -er .head.sha)"
              [[ "$branch" =~ ^xsec-marketplace/external-stable-[0-9]+-[0-9]+$ && "$head_sha" =~ ^[a-f0-9]{40}$ ]] || {
                echo "Generated Stable candidate #${number} has an invalid branch or revision." >&2
                exit 1
              }
              candidate_root="$(mktemp -d "$RUNNER_TEMP/xsec-smoke-status.XXXXXX")"
              cleanup_candidate() { git worktree remove --force "$candidate_root" >/dev/null 2>&1 || true; rm -rf -- "$candidate_root"; }
              git fetch --no-tags origin "$head_sha"
              git worktree add --detach "$candidate_root" "$head_sha" >/dev/null
              status_paths=("$candidate_root"/.xsec-factory/official-status/*.json)
              [ -e "${status_paths[0]}" ] || { cleanup_candidate; continue; }
              matching_status=()
              for status_path in "${status_paths[@]}"; do
                if jq -e --arg smoke_url "$smoke_url" --arg marketplace_revision "$MARKETPLACE_REVISION" '
                  .publication.state == "published" and .publication.smokeRunUrl == $smoke_url and .publication.marketplaceRevision == $marketplace_revision
                ' "$status_path" >/dev/null; then
                  matching_status+=("$status_path")
                fi
              done
              [ "${#matching_status[@]}" -le 1 ] || { echo "Stable candidate #${number} contains multiple matching smoke statuses." >&2; exit 1; }
              if [ "${#matching_status[@]}" -eq 0 ]; then cleanup_candidate; continue; fi
              status_path="${matching_status[0]}"
              plugin_id="$(jq -er .pluginId "$status_path")"
              [[ "$plugin_id" =~ ^[a-z0-9]([a-z0-9.-]{0,62}[a-z0-9])?$ ]] || { echo "Stable candidate has an unsafe status plugin ID." >&2; exit 1; }
              registered="$(jq -cer --arg plugin_id "$plugin_id" '.plugins | [ .[] | select(.pluginId == $plugin_id) ] | if length == 1 then .[0] else error("expected one protected Registry row") end' .xsec-factory/official-registry.json)"
              candidate_registered="$(jq -cer --arg plugin_id "$plugin_id" '.plugins | [ .[] | select(.pluginId == $plugin_id) ] | if length == 1 then .[0] else error("candidate Registry row is ambiguous") end' "$candidate_root/.xsec-factory/official-registry.json)"
              [ "$registered" = "$candidate_registered" ] || { cleanup_candidate; continue; }
              tuple="$(jq -cer --arg plugin_id "$plugin_id" --arg smoke_url "$smoke_url" --arg marketplace_revision "$MARKETPLACE_REVISION" '
                .source as $source | .release as $release | .publication as $publication
                | if .pluginId != $plugin_id
                    or $source.refs != {beta:"refs/heads/beta",stable:"refs/heads/main"}
                    or ($source.repository | type) != "string"
                    or ($source.betaSha | type) != "string"
                    or ($source.stableSha | type) != "string"
                    or ($release.betaReleaseId | type) != "string"
                    or $release.stableReleaseId != $release.betaReleaseId
                    or $publication.state != "published"
                    or $publication.smokeRunUrl != $smoke_url
                    or $publication.marketplaceRevision != $marketplace_revision
                  then error("candidate status is not the exact terminal smoke tuple")
                  else {repository:$source.repository,beta_sha:$source.betaSha,stable_sha:$source.stableSha} end
              ' "$status_path")"
              verification="$(python scripts/kms_marketplace_publisher.py --root "$candidate_root" --verify-active-marketplace-signatures --allow-unsigned-official-status-plugin-id "$plugin_id")"
              generation_base="$(printf '%s' "$verification" | jq -er .source_revision)"
              [[ "$generation_base" =~ ^[a-f0-9]{40}$ ]] || { echo "Stable candidate #${number} has an invalid KMS generation revision." >&2; exit 1; }
              git fetch --no-tags origin "$generation_base" "refs/heads/main:refs/remotes/origin/main"
