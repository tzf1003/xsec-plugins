name: Reconcile official plugin source event

on:
  workflow_dispatch:
    inputs:
      trigger_kind:
        description: source_event or smoke_callback
        required: false
        type: string
      delivery_key:
        description: Immutable Cloud delivery identity
        required: false
        type: string
      plugin_id:
        description: Source-event plugin ID; empty for smoke callbacks
        required: false
        type: string
      source_repository:
        description: Source-event repository; empty for smoke callbacks
        required: false
        type: string
      source_ref:
        description: Source-event beta/main ref; empty for smoke callbacks
        required: false
        type: string
      source_sha:
        description: Source-event exact commit; empty for smoke callbacks
        required: false
        type: string
      marketplace_revision:
        description: Smoke-tested Factory revision; empty for source events
        required: false
        type: string
      channel:
        description: Smoke channel; empty for source events
        required: false
        type: string
      smoke_workflow_run_id:
        description: Desktop smoke run ID; empty for source events
        required: false
        type: string
      smoke_workflow_run_attempt:
        description: Desktop smoke run attempt; empty for source events
        required: false
        type: string

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: xsec-marketplace-reconcile-source-${{ inputs.plugin_id || inputs.marketplace_revision }}
  cancel-in-progress: false

jobs:
  enforce-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require the dedicated Cloud dispatcher App and protected Factory main
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_ACTOR: ${{ vars.XSEC_FACTORY_DISPATCHER_ACTOR }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [ -n "$EXPECTED_ACTOR" ] || { echo "Configure XSEC_FACTORY_DISPATCHER_ACTOR to the dedicated GitHub App bot login." >&2; exit 1; }
          [ "$ACTOR" = "$EXPECTED_ACTOR" ] || { echo "Only the dedicated Cloud Factory dispatcher App may reconcile source events." >&2; exit 1; }
          [ "$REF" = "refs/heads/main" ] && [ "$REF_PROTECTED" = "true" ] || { echo "Reconciliation requires protected Factory main." >&2; exit 1; }
          case "${{ inputs.trigger_kind }}" in
            source_event|smoke_callback) ;;
            *) echo "Unexpected reconciliation trigger kind." >&2; exit 1 ;;
          esac
  validate-and-dispatch:
    needs: enforce-dispatch
    if: ${{ inputs.trigger_kind == 'source_event' }}
    runs-on: ubuntu-latest
    # The only workflow identity allowed by Cloud to sign official-status.
    # The job checks out protected main and treats every candidate branch as
    # opaque data; no candidate workflow, action, or plugin code is executed.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate the complete Cloud source-event payload against protected Registry v2
        id: request
        env:
          TRIGGER_KIND: ${{ inputs.trigger_kind }}
          DELIVERY_KEY: ${{ inputs.delivery_key }}
          PLUGIN_ID: ${{ inputs.plugin_id }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MARKETPLACE_REVISION: ${{ inputs.marketplace_revision }}
          CHANNEL: ${{ inputs.channel }}
          SMOKE_RUN_ID: ${{ inputs.smoke_workflow_run_id }}
          SMOKE_RUN_ATTEMPT: ${{ inputs.smoke_workflow_run_attempt }}
        run: |
          set -euo pipefail
          [ "$TRIGGER_KIND" = "source_event" ] || { echo "Unexpected reconciliation trigger kind." >&2; exit 1; }
          [ -z "$MARKETPLACE_REVISION" ] && [ -z "$CHANNEL" ] && [ -z "$SMOKE_RUN_ID" ] && [ -z "$SMOKE_RUN_ATTEMPT" ] || { echo "Source events must not carry smoke fields." >&2; exit 1; }
          python scripts/external_source_factory.py --github-output "$GITHUB_OUTPUT" prepare-reconcile-source \
            --delivery-key "$DELIVERY_KEY" --plugin-id "$PLUGIN_ID" --source-repository "$SOURCE_REPOSITORY" \
            --source-ref "$SOURCE_REF" --source-sha "$SOURCE_SHA"
      - name: Reject stale delivery before starting a Factory publication
        env:
          SOURCE_REPOSITORY: ${{ steps.request.outputs.source_repository }}
          SOURCE_REF: ${{ steps.request.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          # All official split sources are public.  This fixed HTTPS query is
          # only a stale-event gate; publish.yml repeats the authenticated,
          # redirect-hardened checkout/reachability proof before packaging.
          head_sha="$(git -c credential.helper= -c http.followRedirects=false ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "$SOURCE_REF" | awk 'NR == 1 { print $1 }')"
          [ "$head_sha" = "$SOURCE_SHA" ] || { echo "Source delivery is stale; the registered branch head changed." >&2; exit 1; }
      - name: Controlled supersede of an obsolete same-plugin Beta candidate
        id: supersede
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.request.outputs.channel }}
          DELIVERY_KEY: ${{ inputs.delivery_key }}
          PLUGIN_ID: ${{ steps.request.outputs.plugin_id }}
          SOURCE_REPOSITORY: ${{ steps.request.outputs.source_repository }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          SOURCE_BETA_REF: ${{ steps.request.outputs.beta_ref }}
          SOURCE_STABLE_REF: ${{ steps.request.outputs.stable_ref }}
        run: |
          set -euo pipefail
          # A newer beta *or* main source event can invalidate an in-review
          # candidate.  Always authenticate the generated candidate before
          # deciding whether to keep it: an old beta would otherwise leave the
          # publisher's pending-PR guard permanently stranded, while a stale
          # main gate could never be reviewed through to Desktop smoke.
          [ "$CHANNEL" = "beta" ] || [ "$CHANNEL" = "stable" ] || {
            echo "Unexpected registered source channel." >&2
            exit 1
          }
          beta_sha="$(git -c credential.helper= -c http.followRedirects=false ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "$SOURCE_BETA_REF" | awk 'NR == 1 { print $1 }')"
          [[ "$beta_sha" =~ ^[a-f0-9]{40}$ ]] || { echo "Cannot resolve registered Beta source head." >&2; exit 1; }
          registered="$(jq -cer --arg plugin_id "$PLUGIN_ID" '
            .plugins | [ .[] | select(.pluginId == $plugin_id) ]
            | if length == 1 then .[0] else error("expected exactly one active Registry entry") end
          ' .xsec-factory/official-registry.json)"
          candidates="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" | jq -cer --arg repository "$GITHUB_REPOSITORY" '
            [ .[][]
              | select(.head.repo.full_name == $repository)
              | select(.head.ref | test("^xsec-marketplace/external-beta-[0-9]+-[0-9]+$"))
            ]
          ')"
          current_candidates=()
          stale_candidates=()
          while IFS= read -r candidate; do
            number="$(printf '%s' "$candidate" | jq -er .number)"
            branch="$(printf '%s' "$candidate" | jq -er .head.ref)"
            head_sha="$(printf '%s' "$candidate" | jq -er .head.sha)"
            [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]] || {
              echo "Generated candidate #${number} has malformed revisions." >&2
              exit 1
            }
            candidate_root="$(mktemp -d "$RUNNER_TEMP/xsec-reconcile-candidate.XXXXXX")"
            cleanup_candidate() { git worktree remove --force "$candidate_root" >/dev/null 2>&1 || true; rm -rf -- "$candidate_root"; }
            git fetch --no-tags origin "$head_sha"
            git cat-file -e "$head_sha^{commit}"
            git worktree add --detach "$candidate_root" "$head_sha" >/dev/null
            status_path="$candidate_root/.xsec-factory/official-status/${PLUGIN_ID}.json"
            # A candidate for another plugin must remain in review. Its
            # content is not parsed as authority and cannot be closed by this
            # source-main delivery.
            if [ ! -f "$status_path" ] || ! jq -e --arg id "$PLUGIN_ID" '.pluginId == $id' "$status_path" >/dev/null; then
              cleanup_candidate
              continue
            fi
            candidate_registered="$(jq -cer --arg plugin_id "$PLUGIN_ID" '
              .plugins | [ .[] | select(.pluginId == $plugin_id) ]
              | if length == 1 then .[0] else error("candidate Registry entry is ambiguous") end
            ' "$candidate_root/.xsec-factory/official-registry.json)"
            [ "$candidate_registered" = "$registered" ] || {
              echo "Generated candidate #${number} changed the registered source identity and cannot be superseded." >&2
              exit 1
            }
            release_path="$candidate_root/plugins/${PLUGIN_ID}/.xsec-market/releases.json"
            evidence_path="$candidate_root/.xsec-factory/official-publications/${PLUGIN_ID}.json"
            # Authenticate an in-flight candidate against its *recorded* Beta
            # source and immutable publication event.  Do not require that
            # value to equal the live Beta head here: the comparison below is
            # what intentionally classifies an older generated PR as stale so
            # it can be closed before its replacement is dispatched.
            tuple="$(jq -cer --arg plugin_id "$PLUGIN_ID" --arg repository "$SOURCE_REPOSITORY" \
              --slurpfile release "$release_path" --slurpfile evidence "$evidence_path" '
                $release[0].channels.beta.releaseId as $release_id
                | if ($release_id | type) != "string" then error("candidate has no Beta release") else . end
                | .source as $source
                | .release as $release_status
                | .publication as $publication
                | if .pluginId != $plugin_id
                    or $source.repository != $repository
                    or $source.path != ("plugins/" + $plugin_id)
                    or $source.refs != {beta:"refs/heads/beta",stable:"refs/heads/main"}
                    or ($source.betaSha | type) != "string"
                    or $source.stableSha != null
                    or ($source.mainGateSha | type) != "string"
                    or $release_status.betaReleaseId != $release_id
                    or ($publication.state != "waiting_for_beta" and $publication.state != "waiting_for_smoke")
                  then error("candidate status is not an in-flight registered Beta tuple")
                  elif [ $evidence[0].events[]
                    | select(.channel == "beta" and .releaseId == $release_id
                      and .source.repository == $repository
                      and .source.path == ("plugins/" + $plugin_id)
                      and .source.ref == "refs/heads/beta"
                      and .source.sha == $source.betaSha)
                  ] | length != 1 then error("candidate lacks exact Beta provenance")
                  else {release_id:$release_id,beta_sha:$source.betaSha,main_gate_sha:$source.mainGateSha,state:$publication.state}
                  end
              ' "$status_path")"
            # The KMS proof binds the candidate status, including mainGateSha,
            # to its original protected publisher revision. GitHub's PR base
            # SHA is live and advances when unrelated Factory PRs land, so it
            # is not evidence of the immutable generated-candidate base.
            # It is the generated-candidate identity; a branch prefix or PR
            # title alone is never sufficient to close a reviewed PR.
            verification="$(python scripts/kms_marketplace_publisher.py --root "$candidate_root" --verify-active-marketplace-signatures --allow-unsigned-official-status-plugin-id "$PLUGIN_ID")"
            generation_base="$(printf '%s' "$verification" | jq -er .source_revision)"
            [[ "$generation_base" =~ ^[a-f0-9]{40}$ ]] || {
              echo "Generated candidate #${number} KMS proof has an invalid Factory generation revision." >&2
              exit 1
            }
            # The publisher starts only after its own concurrency slot is
            # acquired, so main can advance after this reconciler checked out
            # its event SHA.  Refresh the protected tracking ref before
            # deriving the generated PR's actual base.
            git fetch --no-tags origin "$generation_base" "refs/heads/main:refs/remotes/origin/main"
            git cat-file -e "$generation_base^{commit}"
            git merge-base --is-ancestor "$generation_base" origin/main || {
              echo "Generated candidate #${number} KMS generation revision is not retained by protected Factory main." >&2
              exit 1
            }
            git merge-base --is-ancestor "$generation_base" "$head_sha" || {
              echo "Generated candidate #${number} does not descend from its KMS generation revision." >&2
              exit 1
            }
            # Compare only the PR's actual delta. A candidate may be rebased
            # onto an intervening protected-main change; the KMS generation
            # revision remains an ancestry proof, not the candidate diff base.
            candidate_base="$(git merge-base "$head_sha" origin/main)"
            [[ "$candidate_base" =~ ^[a-f0-9]{40}$ ]] || {
              echo "Generated candidate #${number} has no canonical Factory merge base." >&2
              exit 1
            }
            git diff --quiet "$candidate_base" "$head_sha" -- ".xsec-factory/official-status/${PLUGIN_ID}.json" && {
              echo "Generated candidate #${number} did not actually change the target Factory status." >&2
              cleanup_candidate
              continue
            }
            candidate_change="$(python scripts/verify_merged_stable_promotion.py --root "$candidate_root" --before "$candidate_base" --after "$head_sha" --classify --allow-unsigned-official-status-plugin-id "$PLUGIN_ID")"
            candidate_plugin="$(printf '%s' "$candidate_change" | jq -er '
              .promotions
              | if type == "array" and length == 1 and (.[0].plugin_id | type) == "string" then .[0].plugin_id else error("candidate does not authenticate one generated plugin") end
            ')"
            if [ "$candidate_plugin" != "$PLUGIN_ID" ]; then
              cleanup_candidate
              continue
            fi
            python scripts/external_source_factory.py --root "$candidate_root" validate
            candidate_beta_sha="$(printf '%s' "$tuple" | jq -er .beta_sha)"
            gate_sha="$(printf '%s' "$tuple" | jq -er .main_gate_sha)"
            cleanup_candidate
            if { [ "$CHANNEL" = "beta" ] && [ "$candidate_beta_sha" = "$beta_sha" ]; } || {
              [ "$CHANNEL" = "stable" ] && [ "$candidate_beta_sha" = "$beta_sha" ] && [ "$gate_sha" = "$SOURCE_SHA" ];
            }; then
              current_candidates+=("$number")
            else
              stale_candidates+=("$number")
            fi
          done < <(printf '%s' "$candidates" | jq -rc '.[]')
          [ "${#current_candidates[@]}" -le 1 ] && [ "${#stale_candidates[@]}" -le 1 ] || {
            echo "Multiple same-plugin generated Beta candidates exist; refusing an ambiguous supersede." >&2
            exit 1
          }
          if [ "${#current_candidates[@]}" -eq 1 ]; then
            [ "${#stale_candidates[@]}" -eq 0 ] || { echo "Current and stale same-plugin Beta candidates coexist; refusing supersede." >&2; exit 1; }
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "current_pr=${current_candidates[0]}" >> "$GITHUB_OUTPUT"
            echo "The immutable source-main delivery already has generated candidate #${current_candidates[0]}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${#stale_candidates[@]}" -eq 1 ]; then
            number="${stale_candidates[0]}"
            audit="Controlled supersede: trusted dispatcher delivery ${DELIVERY_KEY} observed registered ${CHANNEL} source ${SOURCE_SHA} while this same-plugin Beta candidate retained an older KMS-bound source tuple. It is closed before a new source-gated candidate is requested; the replacement still requires validate.yml, @codex review, and protected final merge."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" -f body="$audit" >/dev/null
            closure="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" -f state=closed)"
            [ "$(printf '%s' "$closure" | jq -er .state)" = "closed" ] || {
              echo "GitHub did not confirm closure of stale generated candidate #${number}." >&2
              exit 1
            }
            echo "superseded_pr=$number" >> "$GITHUB_OUTPUT"
            echo "Superseded stale same-plugin generated candidate #${number}; a replacement dispatch follows." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
      - name: Publish current Beta or recheck its main reproducibility gate
        id: dispatch-publisher
        if: ${{ steps.supersede.outputs.dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.request.outputs.channel }}
          DELIVERY_KEY: ${{ steps.request.outputs.delivery_key }}
          PLUGIN_ID: ${{ steps.request.outputs.plugin_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          SOURCE_REPOSITORY: ${{ steps.request.outputs.source_repository }}
          SOURCE_BETA_REF: ${{ steps.request.outputs.beta_ref }}
        run: |
          set -euo pipefail
          echo "publisher_dispatch_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "stable" ]; then
            # main never promotes Stable directly. Re-read the protected
            # Registry beta ref and let publish.yml deterministically compare
            # that exact current Beta with current main. A mismatch leaves
            # waiting_for_beta; a match starts a fresh Desktop smoke cycle.
            beta_sha="$(git -c credential.helper= -c http.followRedirects=false ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "$SOURCE_BETA_REF" | awk 'NR == 1 { print $1 }')"
            [ -n "$beta_sha" ] || { echo "Cannot resolve registered source beta for ${PLUGIN_ID}." >&2; exit 1; }
            gh workflow run publish.yml --ref main \
              -f channel=beta -f plugin_id="$PLUGIN_ID" -f source_sha="$beta_sha" \
              -f reconcile_delivery_key="$DELIVERY_KEY" \
              -f reconcile_dispatch_nonce="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            exit 0
          fi
          gh workflow run publish.yml --ref main \
            -f channel=beta -f plugin_id="$PLUGIN_ID" -f source_sha="$SOURCE_SHA" \
            -f reconcile_delivery_key="$DELIVERY_KEY" \
            -f reconcile_dispatch_nonce="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
      - name: Authenticate, sign, and source-gate the exact generated Beta candidate
        # publish.yml deliberately leaves the changed official status unsigned.
        # This protected dispatcher workflow is the sole Cloud-authorized
        # signer for that one status, and never executes candidate-controlled
        # code, workflow files, actions, or plugin hooks.
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.request.outputs.channel }}
          PLUGIN_ID: ${{ steps.request.outputs.plugin_id }}
          SOURCE_REPOSITORY: ${{ steps.request.outputs.source_repository }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          SOURCE_BETA_REF: ${{ steps.request.outputs.beta_ref }}
          SOURCE_STABLE_REF: ${{ steps.request.outputs.stable_ref }}
          DELIVERY_KEY: ${{ steps.request.outputs.delivery_key }}
          PUBLISHER_DISPATCH_EPOCH: ${{ steps.dispatch-publisher.outputs.publisher_dispatch_epoch }}
          RECONCILE_DISPATCH_NONCE: ${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$PLUGIN_ID" =~ ^[a-z0-9]([a-z0-9.-]{0,62}[a-z0-9])?$ ]] || {
            echo "Registered plugin ID is unsafe." >&2
            exit 1
          }
          deadline="$((SECONDS + 900))"
          while :; do
            beta_sha="$(git -c credential.helper= -c http.followRedirects=false ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" "$SOURCE_BETA_REF" | awk 'NR == 1 { print $1 }')"
            [[ "$beta_sha" =~ ^[a-f0-9]{40}$ ]] || { echo "Cannot resolve the registered Beta source head." >&2; exit 1; }
            if [ "$CHANNEL" = "beta" ]; then
              [ "$beta_sha" = "$SOURCE_SHA" ] || { echo "The source event is stale before candidate authentication." >&2; exit 1; }
            else
              main_sha="$(git -c credential.helper= -c http.followRedirects=false ls-remote "https://github.com/${SOURCE_REPOSITORY}.git" refs/heads/main | awk 'NR == 1 { print $1 }')"
              [ "$main_sha" = "$SOURCE_SHA" ] || { echo "The registered main source advanced before candidate authentication." >&2; exit 1; }
            fi
            registered="$(jq -cer --arg plugin_id "$PLUGIN_ID" '
              .plugins | [ .[] | select(.pluginId == $plugin_id) ]
              | if length == 1 then .[0] else error("expected one active Registry row") end
            ' .xsec-factory/official-registry.json)"
            candidates="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" | jq -cer --arg repository "$GITHUB_REPOSITORY" '
              [ .[][]
                | select(.head.repo.full_name == $repository)
                | select(.head.ref | test("^xsec-marketplace/external-beta-[0-9]+-[0-9]+$"))
              ]
            ')"
            matches=()
            while IFS= read -r candidate; do
              number="$(printf '%s' "$candidate" | jq -er .number)"
              branch="$(printf '%s' "$candidate" | jq -er .head.ref)"
              head_sha="$(printf '%s' "$candidate" | jq -er .head.sha)"
              [[ "$branch" =~ ^xsec-marketplace/external-beta-[0-9]+-[0-9]+$ && "$head_sha" =~ ^[a-f0-9]{40}$ ]] || {
                echo "Generated candidate #${number} has an invalid branch or revision." >&2
                exit 1
              }
              candidate_root="$(mktemp -d "$RUNNER_TEMP/xsec-status-candidate.XXXXXX")"
              cleanup_candidate() { git worktree remove --force "$candidate_root" >/dev/null 2>&1 || true; rm -rf -- "$candidate_root"; }
              git fetch --no-tags origin "$head_sha"
              git worktree add --detach "$candidate_root" "$head_sha" >/dev/null
              status_path="$candidate_root/.xsec-factory/official-status/${PLUGIN_ID}.json"
              if [ ! -f "$status_path" ] || ! jq -e --arg id "$PLUGIN_ID" '.pluginId == $id' "$status_path" >/dev/null; then
                cleanup_candidate
                continue
              fi
              candidate_registered="$(jq -cer --arg plugin_id "$PLUGIN_ID" '
                .plugins | [ .[] | select(.pluginId == $plugin_id) ]
                | if length == 1 then .[0] else error("candidate Registry entry is ambiguous") end
              ' "$candidate_root/.xsec-factory/official-registry.json)"
              [ "$candidate_registered" = "$registered" ] || { cleanup_candidate; continue; }
              verification="$(python scripts/kms_marketplace_publisher.py --root "$candidate_root" --verify-active-marketplace-signatures --allow-unsigned-official-status-plugin-id "$PLUGIN_ID")"
              generation_base="$(printf '%s' "$verification" | jq -er .source_revision)"
              [[ "$generation_base" =~ ^[a-f0-9]{40}$ ]] || { echo "Candidate #${number} has an invalid KMS generation revision." >&2; exit 1; }
              git fetch --no-tags origin "$generation_base" "refs/heads/main:refs/remotes/origin/main"
              git cat-file -e "$generation_base^{commit}"
              git merge-base --is-ancestor "$generation_base" origin/main || { echo "Candidate #${number} generation is not retained by protected main." >&2; exit 1; }
              git merge-base --is-ancestor "$generation_base" "$head_sha" || { echo "Candidate #${number} does not descend from its KMS generation revision." >&2; exit 1; }
              # As above, leave the sidecar's protected generation revision as
              # an ancestry proof but classify only the candidate's own delta.
              candidate_base="$(git merge-base "$head_sha" origin/main)"
              [[ "$candidate_base" =~ ^[a-f0-9]{40}$ ]] || { echo "Candidate #${number} has no canonical Factory merge base." >&2; exit 1; }
              git diff --quiet "$candidate_base" "$head_sha" -- ".xsec-factory/official-status/${PLUGIN_ID}.json" && {
                echo "Candidate #${number} did not actually change the requested Factory status." >&2
                cleanup_candidate
                continue
              }
              candidate_change="$(python scripts/verify_merged_stable_promotion.py --root "$candidate_root" --before "$candidate_base" --after "$head_sha" --classify --allow-unsigned-official-status-plugin-id "$PLUGIN_ID")"
              candidate_plugin="$(printf '%s' "$candidate_change" | jq -er '.promotions | if type == "array" and length == 1 and (.[0].plugin_id | type) == "string" then .[0].plugin_id else error("candidate does not authenticate exactly one plugin") end')"
              if [ "$candidate_plugin" != "$PLUGIN_ID" ]; then
                cleanup_candidate
                continue
              fi
              tuple="$(jq -cer --arg plugin_id "$PLUGIN_ID" --arg repository "$SOURCE_REPOSITORY" --arg beta_sha "$beta_sha" '
                .source as $source | .release as $release | .publication as $publication
                | if .pluginId != $plugin_id
                    or $source.repository != $repository
                    or $source.path != ("plugins/" + $plugin_id)
                    or $source.refs != {beta:"refs/heads/beta",stable:"refs/heads/main"}
                    or $source.betaSha != $beta_sha
                    or $source.stableSha != null
                    or ($source.mainGateSha | type) != "string"
                    or ($release.betaReleaseId | type) != "string"
                    or ($publication.state != "waiting_for_beta" and $publication.state != "waiting_for_smoke")
                  then error("candidate status is not the current in-flight Beta tuple")
                  else {main_gate_sha:$source.mainGateSha} end
              ' "$status_path")"
              if [ "$CHANNEL" = "stable" ] && [ "$(printf '%s' "$tuple" | jq -er .main_gate_sha)" != "$SOURCE_SHA" ]; then
                cleanup_candidate
                continue
              fi
              python scripts/external_source_factory.py --root "$candidate_root" validate
              matches+=("${number}|${branch}|${head_sha}|${generation_base}|${candidate_base}")
              cleanup_candidate
            done < <(printf '%s' "$candidates" | jq -rc '.[]')
            [ "${#matches[@]}" -le 1 ] || { echo "Multiple authenticated current candidates exist; refusing to sign ambiguously." >&2; exit 1; }
            if [ "${#matches[@]}" -eq 0 ]; then
              # A duplicate delivery may intentionally be a no-op: publish.yml
              # creates no PR in that case. Wait for the dispatched protected
              # publisher's exact receipt before treating the absence of a PR
              # as success; never infer a no-op from an empty PR list.
              if [ -n "$PUBLISHER_DISPATCH_EPOCH" ]; then
                receipt_name="xsec-reconcile-receipt-$(printf '%s' "${DELIVERY_KEY}:${RECONCILE_DISPATCH_NONCE}" | sha256sum | awk '{print $1}')"
                artifact="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${receipt_name}&per_page=100" | jq -cr \
                  --arg name "$receipt_name" --argjson after "$PUBLISHER_DISPATCH_EPOCH" '
                    [ .[]?.artifacts[]?
                      | select(.name == $name and .expired == false and (.created_at | fromdateiso8601) >= $after)
                    ] | sort_by(.created_at) | last // empty
                  ')"
                if [ -n "$artifact" ]; then
                  artifact_id="$(printf '%s' "$artifact" | jq -er .id)"
                  publisher_run_id="$(printf '%s' "$artifact" | jq -er .workflow_run.id)"
                  [[ "$artifact_id" =~ ^[0-9]+$ && "$publisher_run_id" =~ ^[0-9]+$ ]] || {
                    echo "Publisher receipt artifact identity is malformed." >&2
                    exit 1
                  }
                  publisher_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${publisher_run_id}" | jq -cer '{event,head_branch,status,conclusion}')"
                  [ "$(printf '%s' "$publisher_run" | jq -er .event)" = "workflow_dispatch" ] \
                    && [ "$(printf '%s' "$publisher_run" | jq -er .head_branch)" = "main" ] || {
                      echo "The publisher receipt was not emitted by a protected-main manual publish run." >&2
                      exit 1
                    }
                  publisher_status="$(printf '%s' "$publisher_run" | jq -er .status)"
                  if [ "$publisher_status" != "completed" ]; then
                    # Artifact upload can become visible before GitHub marks
                    # its originating workflow completed.  This is a normal
                    # poll state, not a failed no-op reconciliation.
                    [ "$SECONDS" -lt "$deadline" ] || { echo "Timed out waiting for the publisher receipt run to complete." >&2; exit 1; }
                    sleep 5
                    continue
                  fi
                  [ "$(printf '%s' "$publisher_run" | jq -er .conclusion)" = "success" ] || {
                    echo "The publisher run that emitted the receipt did not complete successfully." >&2
                    exit 1
                  }
                  receipt_root="$(mktemp -d "$RUNNER_TEMP/xsec-publisher-receipt.XXXXXX")"
                  cleanup_receipt() { rm -rf -- "$receipt_root"; }
                  gh run download "$publisher_run_id" --name "$receipt_name" --dir "$receipt_root"
                  receipt_path="$receipt_root/receipt.json"
                  factory_revision="$(jq -er '.factoryRevision | strings | select(test("^[a-f0-9]{40}$"))' "$receipt_path")"
                  # publish.yml checks out protected main after acquiring its
                  # publication slot.  Its event head is deliberately not the
                  # Factory revision used for the receipt.  Authenticate the
                  # recorded checkout revision as retained protected history.
                  git fetch --no-tags origin "$factory_revision" "refs/heads/main:refs/remotes/origin/main"
                  git cat-file -e "$factory_revision^{commit}"
                  git merge-base --is-ancestor "$factory_revision" origin/main || {
                    echo "Publisher receipt Factory revision is not retained by protected main." >&2
                    exit 1
                  }
                  receipt="$(jq -cer \
                    --arg delivery_key "$DELIVERY_KEY" --arg dispatch_nonce "$RECONCILE_DISPATCH_NONCE" --arg plugin_id "$PLUGIN_ID" --arg source_sha "$beta_sha" --arg channel "beta" \
                    --arg factory_revision "$factory_revision" '
                      if .schemaVersion == 1
                        and .deliveryKey == $delivery_key
                        and .dispatchNonce == $dispatch_nonce
                        and .pluginId == $plugin_id
                        and .sourceSha == $source_sha
                        and .channel == $channel
                        and .factoryRevision == $factory_revision
                        and (.outcome == "candidate" or .outcome == "no-op")
                      then .outcome else error("receipt does not bind this source reconciliation") end
                    ' "$receipt_path")"
