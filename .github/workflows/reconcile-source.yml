              [ "$(printf '%s' "$candidate_change" | jq -er '.promotions | if type == "array" and length == 1 and (.[0].plugin_id | type) == "string" then .[0].plugin_id else error("candidate does not authenticate exactly one plugin") end')" = "$plugin_id" ] || {
                echo "Stable candidate #${number} does not authenticate its terminal status plugin." >&2
                exit 1
              }
              python scripts/external_source_factory.py --root "$candidate_root" validate
              cleanup_candidate
              latest="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" | jq -cer '{branch:.head.ref,head:.head.sha,state:.state}')"
              [ "$(printf '%s' "$latest" | jq -er .state)" = "open" ] \
                && [ "$(printf '%s' "$latest" | jq -er .branch)" = "$branch" ] \
                && [ "$(printf '%s' "$latest" | jq -er .head)" = "$head_sha" ] || continue
              candidate_root="$(mktemp -d "$RUNNER_TEMP/xsec-smoke-sign.XXXXXX")"
              cleanup_signed_candidate() { git worktree remove --force "$candidate_root" >/dev/null 2>&1 || true; rm -rf -- "$candidate_root"; }
              git worktree add --detach "$candidate_root" "$head_sha" >/dev/null
              status_proof=".xsec-factory/official-status-proofs/${plugin_id}.json"
              if python scripts/kms_marketplace_publisher.py --root "$candidate_root" --verify-active-marketplace-signatures >/dev/null 2>&1; then
                signed_head="$head_sha"
              else
                repository="$(printf '%s' "$tuple" | jq -er .repository)"
                beta_sha="$(printf '%s' "$tuple" | jq -er .beta_sha)"
                stable_sha="$(printf '%s' "$tuple" | jq -er .stable_sha)"
                current_beta="$(git -c credential.helper= -c http.followRedirects=false ls-remote "https://github.com/${repository}.git" refs/heads/beta | awk 'NR == 1 { print $1 }')"
                current_main="$(git -c credential.helper= -c http.followRedirects=false ls-remote "https://github.com/${repository}.git" refs/heads/main | awk 'NR == 1 { print $1 }')"
                [ "$current_beta" = "$beta_sha" ] && [ "$current_main" = "$stable_sha" ] || {
                  echo "A source branch advanced before terminal status signing." >&2
                  exit 1
                }
                XSEC_MARKETPLACE_SOURCE_REVISION="$generation_base" \
                  python scripts/kms_marketplace_publisher.py --root "$candidate_root" --official-status-plugin-id "$plugin_id"
                git -C "$candidate_root" diff --quiet -- .xsec-factory/official-status || {
                  echo "Status signer changed a terminal status document." >&2
                  exit 1
                }
                git -C "$candidate_root" add -- "$status_proof"
                [ "$(git -C "$candidate_root" diff --cached --name-only --no-renames)" = "$status_proof" ] || {
                  echo "Terminal status signer staged an unauthorized path." >&2
                  exit 1
                }
                git -C "$candidate_root" config user.name "xsec-marketplace[bot]"
                git -C "$candidate_root" config user.email "xsec-marketplace[bot]@users.noreply.github.com"
                git -C "$candidate_root" commit -m "chore: authenticate official Factory status"
                signed_head="$(git -C "$candidate_root" rev-parse HEAD)"
              fi
              signed_change="$(python scripts/verify_merged_stable_promotion.py --root "$candidate_root" --before "$candidate_base" --after "$signed_head" --classify)"
              [ "$(printf '%s' "$signed_change" | jq -er '.promotions | if type == "array" and length == 1 and (.[0].plugin_id | type) == "string" then .[0].plugin_id else error("candidate no longer authenticates one plugin") end')" = "$plugin_id" ] || {
                echo "Signed Stable candidate does not authenticate its plugin." >&2
                exit 1
              }
              final_verification="$(python scripts/kms_marketplace_publisher.py --root "$candidate_root" --verify-active-marketplace-signatures)"
              [ "$(printf '%s' "$final_verification" | jq -er .source_revision)" = "$generation_base" ] || { echo "Terminal status proof has the wrong generation revision." >&2; exit 1; }
              python scripts/external_source_factory.py --root "$candidate_root" validate
              if [ "$signed_head" != "$head_sha" ]; then git -C "$candidate_root" push origin "HEAD:refs/heads/${branch}"; fi
              cleanup_signed_candidate
              gh workflow run validate.yml --ref "$branch"
              gate_deadline="$((SECONDS + 900))"
              while :; do
                source_gate="$(gh run list --workflow validate.yml --branch "$branch" --event workflow_dispatch --limit 20 --json headSha,status,conclusion | jq -rc --arg revision "$signed_head" '.[] | select(.headSha == $revision) | @base64' | head -n 1)"
                if [ -n "$source_gate" ]; then
                  source_gate_json="$(printf '%s' "$source_gate" | base64 --decode)"
                  [ "$(printf '%s' "$source_gate_json" | jq -r .status)" = "completed" ] || { sleep 5; continue; }
                  [ "$(printf '%s' "$source_gate_json" | jq -r .conclusion)" = "success" ] || { echo "The signed Stable candidate source gate failed." >&2; exit 1; }
                  break
                fi
                [ "$SECONDS" -lt "$gate_deadline" ] || { echo "Timed out waiting for the signed Stable candidate source gate." >&2; exit 1; }
                sleep 5
              done
              review_body="@codex review"$'\n\n'"Protected reconcile-source authenticated the terminal smoke status proof at ${signed_head}, then the Factory source gate passed. Review the Stable pointer, immutable provenance, KMS sidecars, and smoke-bound status before protected merge. This workflow never merges the PR."
              gh pr comment "$number" --body "$review_body"
              completed="${completed}${number}|"
              completed_count="$((completed_count + 1))"
              progressed=true
            done < <(printf '%s' "$candidates" | jq -rc '.[]')
            [ "$completed_count" -ge "$EXPECTED_REQUESTS" ] && break
            if ! "$progressed"; then
              [ "$SECONDS" -lt "$deadline" ] || { echo "Timed out waiting for smoke completion candidates." >&2; exit 1; }
              sleep 5
            fi
          done
          echo "Authenticated ${completed_count} smoke completion candidate(s); source gates passed and Codex review was requested." >> "$GITHUB_STEP_SUMMARY"
