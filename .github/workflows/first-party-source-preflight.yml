name: First-party source preflight

on:
  workflow_call:
    inputs:
      plugin_id:
        description: Registered first-party plugin ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: source-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the root plugin package, release identity, and whitespace
        env:
          PLUGIN_ID: ${{ inputs.plugin_id }}
        run: |
          set -euo pipefail
          [[ "$PLUGIN_ID" =~ ^com\.xsec\.[a-z0-9.-]+$ ]] || { echo "plugin_id is not a first-party XSEC identifier." >&2; exit 1; }
          manifest="plugin.json"
          codex_manifest=".codex-plugin/plugin.json"
          [ -f "$manifest" ] || { echo "Root plugin manifest is missing." >&2; exit 1; }
          [ -f "$codex_manifest" ] || { echo "Root Codex plugin manifest is missing." >&2; exit 1; }
          [ ! -e "plugins/${PLUGIN_ID}/plugin.json" ] || {
            echo "Nested plugin packages are not supported; the Git root must be the package root." >&2
            exit 1
          }
          node --input-type=module - "$manifest" "$PLUGIN_ID" <<'NODE'
          import { readFileSync, realpathSync, statSync } from "node:fs";
          import { dirname, isAbsolute, relative, resolve } from "node:path";
          const [manifestPath, expectedId] = process.argv.slice(2);
          const pluginRoot = realpathSync(resolve("."));
          const manifestTarget = realpathSync(resolve(manifestPath));
          if (dirname(manifestTarget) !== pluginRoot || !statSync(manifestTarget).isFile()) process.exit(1);
          const manifest = JSON.parse(readFileSync(manifestTarget, "utf8"));
          if (manifest.name !== expectedId || typeof manifest.version !== "string" || !manifest.version) process.exit(1);
          const desktop = manifest.extensions?.["com.xsec.desktop"];
          if (!desktop || typeof desktop !== "object" || !desktop.engines || typeof desktop.engines !== "object") process.exit(1);
          const frontend = desktop.entrypoints?.frontend;
          if (typeof frontend !== "string" || !frontend.startsWith("./")) process.exit(1);
          const frontendTarget = realpathSync(resolve(pluginRoot, frontend));
          const frontendRelative = relative(pluginRoot, frontendTarget);
          if (!frontendRelative || frontendRelative === ".." || frontendRelative.startsWith("../") || isAbsolute(frontendRelative)) process.exit(1);
          if (!statSync(frontendTarget).isFile()) process.exit(1);
          NODE
          git diff --check HEAD^
