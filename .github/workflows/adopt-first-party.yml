name: Sign staged first-party adoption proof

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: Pending Registry v2 first-party plugin ID with a validated staged proof
        required: true
        type: string

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  # Adoption writes the same Registry/provenance surfaces as a release and
  # therefore cannot run beside a generated PR awaiting protected final merge.
  group: xsec-marketplace-publish-main
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require protected main and the narrowly scoped Factory publisher token
        env:
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          XSEC_MARKETPLACE_PUBLISH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] && [ "$REF_PROTECTED" = "true" ] || { echo "First-party adoption requires protected Factory main." >&2; exit 1; }
          [ -n "$XSEC_MARKETPLACE_PUBLISH_TOKEN" ] || { echo "The protected Factory publisher token is required." >&2; exit 1; }
      # actions/checkout v4.4.0, pinned after resolving the signed tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: refs/heads/main
          token: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
      - name: Record the protected Factory revision after acquiring the adoption slot
        id: factory
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          [ "$revision" = "$(git rev-parse origin/main)" ] || { echo "Checkout is not current protected Factory main." >&2; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Refuse to sign while any generated Factory PR awaits protected final merge
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          pending="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" |
              jq -r --arg repository "$GITHUB_REPOSITORY" '
                .[] |
                select(.head.repo.full_name == $repository) |
                .head.ref |
                select(startswith("xsec-marketplace/"))
              '
          )"
          if [ -n "$pending" ]; then
            printf 'A generated Marketplace PR is still awaiting source validation and protected final merge:\n%s\n' "$pending" >&2
            exit 1
          fi
      # actions/setup-python v6.3.0, pinned after resolving the signed tag.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      # actions/setup-node v4.4.0, pinned after resolving the signed tag.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Rebuild the staged assertion from its protected pre-staging baseline
        id: request
        env:
          PLUGIN_ID: ${{ inputs.plugin_id }}
        run: |
          set -euo pipefail
          [[ "$PLUGIN_ID" =~ ^[a-z0-9]([a-z0-9.-]{0,62}[a-z0-9])?$ && "$PLUGIN_ID" != *..* && "$PLUGIN_ID" != *--* ]] || {
            echo "First-party adoption plugin ID is unsafe." >&2
            exit 1
          }
          adoption_path=".xsec-factory/official-adoptions/${PLUGIN_ID}.json"
          baseline_revision="$(jq -er '.legacy.factoryRevision | strings | select(test("^[a-f0-9]{40}$"))' "$adoption_path")"
          git cat-file -e "${baseline_revision}^{commit}" || {
            echo "The staged assertion does not name an available protected Factory baseline commit." >&2
            exit 1
          }
          # A staging PR may be rebased or squash-merged after unrelated
          # protected-main work. The assertion retains the exact protected
          # revision it was built from, which must remain on main's ancestry;
          # do not derive the baseline from the later merge commit's parent.
          git merge-base --is-ancestor "$baseline_revision" HEAD || {
            echo "The staged assertion Factory baseline is not retained by protected main." >&2
            exit 1
          }
          baseline_root="${RUNNER_TEMP}/xsec-adoption-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [ ! -e "$baseline_root" ] || { echo "The pre-staging baseline worktree path already exists." >&2; exit 1; }
          git worktree add --detach "$baseline_root" "$baseline_revision"
          trap 'git worktree remove --force "$baseline_root"' EXIT
          python scripts/external_source_factory.py --github-output "$GITHUB_OUTPUT" prepare-staged-adoption \
            --plugin-id "$PLUGIN_ID" --baseline-root "$baseline_root" --factory-revision "$baseline_revision"
      - name: Require both staged source heads to remain the validated branch heads
        env:
          SOURCE_REPOSITORY: ${{ steps.request.outputs.source_repository }}
          BETA_REF: ${{ steps.request.outputs.beta_ref }}
          STABLE_REF: ${{ steps.request.outputs.stable_ref }}
          BETA_SHA: ${{ steps.request.outputs.beta_sha }}
          STABLE_SHA: ${{ steps.request.outputs.stable_sha }}
        run: |
          set -euo pipefail
          remote="https://github.com/${SOURCE_REPOSITORY}.git"
          beta_head="$(git -c credential.helper= -c http.followRedirects=false ls-remote "$remote" "$BETA_REF" | awk 'NR == 1 { print $1 }')"
          stable_head="$(git -c credential.helper= -c http.followRedirects=false ls-remote "$remote" "$STABLE_REF" | awk 'NR == 1 { print $1 }')"
          [ "$beta_head" = "$BETA_SHA" ] || { echo "The source beta head changed before adoption." >&2; exit 1; }
          [ "$stable_head" = "$STABLE_SHA" ] || { echo "The source main head changed before adoption." >&2; exit 1; }
      - name: Validate retained artifacts and staged unsigned adoption before KMS
        run: |
          python scripts/validate_market.py source --source-root . --built-root .
          python scripts/external_source_factory.py validate
      - name: Request the one staged KMS adoption sidecar through the production Cloud broker
        env:
          XSEC_MARKETPLACE_SOURCE_REVISION: ${{ steps.factory.outputs.revision }}
          PLUGIN_ID: ${{ steps.request.outputs.plugin_id }}
        run: python scripts/kms_marketplace_publisher.py --root . --first-party-adoption-plugin-id "$PLUGIN_ID"
      - name: Require the KMS proof before activating the Registry
        env:
          XSEC_MARKETPLACE_SOURCE_REVISION: ${{ steps.factory.outputs.revision }}
          PLUGIN_ID: ${{ steps.request.outputs.plugin_id }}
        run: |
          python scripts/kms_marketplace_publisher.py --root . --first-party-adoption-plugin-id "$PLUGIN_ID" --validate-only
          python scripts/external_source_factory.py activate-first-party --plugin-id "$PLUGIN_ID"
          python scripts/external_source_factory.py validate
      - name: Open a signed activation PR for independent review
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          plugin_id="${{ steps.request.outputs.plugin_id }}"
          git add -- ".xsec-factory/official-registry.json" \
            ".xsec-factory/official-adoption-proofs/${plugin_id}.json"
          expected="$(printf '%s\n%s' \
            '.xsec-factory/official-adoption-proofs/'"${plugin_id}"'.json' \
            '.xsec-factory/official-registry.json' | sort)"
          changed="$(git diff --cached --name-only | sort)"
          [ "$changed" = "$expected" ] || { printf 'Activation may change only Registry and KMS sidecar, got:\n%s\n' "$changed" >&2; exit 1; }
          git diff --cached --quiet && { echo "No first-party adoption changes to publish." >&2; exit 1; }
          git config user.name "xsec-marketplace[bot]"
          git config user.email "xsec-marketplace[bot]@users.noreply.github.com"
          git commit -m "chore: adopt first-party plugin history"
          revision="$(git rev-parse HEAD)"
          branch="xsec-marketplace/adopt-first-party-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git push --set-upstream origin "$branch"
          pull_url="$(gh pr create --base main --head "$branch" --title "chore: activate signed first-party plugin history" --body "Generated by protected adoption workflow ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Cloud KMS signed the exact immutable assertion already validated on protected main. This PR only adds the KMS sidecar and activates the validated Registry entry; it does not create a release or move a channel pointer.")"
          pull_number="${pull_url##*/}"
          [[ "$pull_number" =~ ^[1-9][0-9]*$ ]] || { echo "Generated Factory PR number is invalid." >&2; exit 1; }
          gh workflow run validate.yml --ref "$branch"
          deadline="$((SECONDS + 900))"
          while :; do
            source_gate="$(gh run list --workflow validate.yml --branch "$branch" --event workflow_dispatch --limit 20 --json headSha,status,conclusion | jq -rc --arg revision "$revision" '.[] | select(.headSha == $revision) | @base64' | head -n 1)"
            if [ -n "$source_gate" ]; then
              source_gate_json="$(printf '%s' "$source_gate" | base64 --decode)"
              [ "$(printf '%s' "$source_gate_json" | jq -r .status)" = "completed" ] || { sleep 5; continue; }
              [ "$(printf '%s' "$source_gate_json" | jq -r .conclusion)" = "success" ] || { echo "The signed adoption source gate failed." >&2; exit 1; }
              break
            fi
            [ "$SECONDS" -lt "$deadline" ] || { echo "Timed out waiting for signed adoption source gate." >&2; exit 1; }
            sleep 5
          done
          {
            echo "## First-party adoption PR"
            echo
            echo "${pull_url}"
            echo
            echo "The source gate passed. The protected final merge may now run."
          } >> "$GITHUB_STEP_SUMMARY"
