name: Adopt retained first-party plugin history

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: Pending Registry v2 first-party plugin ID to activate
        required: true
        type: string
      beta_sha:
        description: Exact current refs/heads/beta commit in the approved source repository
        required: true
        type: string
      stable_sha:
        description: Exact current refs/heads/main commit in the approved source repository
        required: true
        type: string

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  # Adoption writes the same Registry/provenance surfaces as a release and
  # therefore cannot run beside a generated PR awaiting review.
  group: xsec-marketplace-publish-main
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require protected main and the narrowly scoped Factory publisher token
        env:
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          XSEC_MARKETPLACE_PUBLISH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] && [ "$REF_PROTECTED" = "true" ] || { echo "First-party adoption requires protected Factory main." >&2; exit 1; }
          [ -n "$XSEC_MARKETPLACE_PUBLISH_TOKEN" ] || { echo "The protected Factory publisher token is required." >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main
          token: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
      - name: Record the protected Factory revision after acquiring the adoption slot
        id: factory
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          [ "$revision" = "$(git rev-parse origin/main)" ] || { echo "Checkout is not current protected Factory main." >&2; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Refuse to sign while any generated Factory PR awaits review
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          pending="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq '.[] | .head.ref | select(startswith("xsec-marketplace/"))')"
          if [ -n "$pending" ]; then
            printf 'A generated Marketplace PR is still awaiting source/Codex review and protected merge:\n%s\n' "$pending" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve only the pending reviewed Registry entry
        id: request
        env:
          PLUGIN_ID: ${{ inputs.plugin_id }}
          BETA_SHA: ${{ inputs.beta_sha }}
          STABLE_SHA: ${{ inputs.stable_sha }}
        run: |
          python scripts/external_source_factory.py --github-output "$GITHUB_OUTPUT" prepare-adoption \
            --plugin-id "$PLUGIN_ID" --beta-sha "$BETA_SHA" --stable-sha "$STABLE_SHA"
      - name: Require both supplied source heads to remain the reviewed branch heads
        env:
          SOURCE_REPOSITORY: ${{ steps.request.outputs.source_repository }}
          BETA_REF: ${{ steps.request.outputs.beta_ref }}
          STABLE_REF: ${{ steps.request.outputs.stable_ref }}
          BETA_SHA: ${{ steps.request.outputs.beta_sha }}
          STABLE_SHA: ${{ steps.request.outputs.stable_sha }}
        run: |
          set -euo pipefail
          remote="https://github.com/${SOURCE_REPOSITORY}.git"
          beta_head="$(git -c credential.helper= -c http.followRedirects=false ls-remote "$remote" "$BETA_REF" | awk 'NR == 1 { print $1 }')"
          stable_head="$(git -c credential.helper= -c http.followRedirects=false ls-remote "$remote" "$STABLE_REF" | awk 'NR == 1 { print $1 }')"
          [ "$beta_head" = "$BETA_SHA" ] || { echo "The source beta head changed before adoption." >&2; exit 1; }
          [ "$stable_head" = "$STABLE_SHA" ] || { echo "The source main head changed before adoption." >&2; exit 1; }
      - name: Stage the immutable adoption and activate the reviewed Registry entry
        env:
          PLUGIN_ID: ${{ steps.request.outputs.plugin_id }}
          BETA_SHA: ${{ steps.request.outputs.beta_sha }}
          STABLE_SHA: ${{ steps.request.outputs.stable_sha }}
          FACTORY_REVISION: ${{ steps.factory.outputs.revision }}
        run: |
          set -euo pipefail
          python scripts/external_source_factory.py adopt-first-party --plugin-id "$PLUGIN_ID" \
            --beta-sha "$BETA_SHA" --stable-sha "$STABLE_SHA" --factory-revision "$FACTORY_REVISION"
          python scripts/external_source_factory.py activate-first-party --plugin-id "$PLUGIN_ID"
      - name: Validate retained artifacts and unsigned staged adoption before KMS
        run: |
          python scripts/validate_market.py source --source-root . --built-root .
          python scripts/external_source_factory.py validate --allow-unsigned-publication-proofs
      - name: Request KMS sidecars through the production Cloud broker
        env:
          XSEC_MARKETPLACE_SOURCE_REVISION: ${{ steps.factory.outputs.revision }}
        run: python scripts/kms_marketplace_publisher.py --root .
      - name: Require the signed adoption before any write
        env:
          XSEC_MARKETPLACE_SOURCE_REVISION: ${{ steps.factory.outputs.revision }}
        run: |
          python scripts/kms_marketplace_publisher.py --root . --validate-only
          python scripts/external_source_factory.py validate
      - name: Open a signed activation PR for independent review
        env:
          GH_TOKEN: ${{ secrets.XSEC_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          git add -A -- .xsec-factory
          git diff --cached --quiet && { echo "No first-party adoption changes to publish." >&2; exit 1; }
          git config user.name "xsec-marketplace[bot]"
          git config user.email "xsec-marketplace[bot]@users.noreply.github.com"
          git commit -m "chore: adopt first-party plugin history"
          revision="$(git rev-parse HEAD)"
          branch="xsec-marketplace/adopt-first-party-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git push --set-upstream origin "$branch"
          pull_url="$(gh pr create --base main --head "$branch" --title "chore: adopt first-party plugin history" --body "Generated by protected adoption workflow ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. It binds retained immutable release history to exact approved source heads and a KMS proof; it does not create a release or move a channel pointer.")"
          pull_number="$(gh pr view "$pull_url" --json number --jq .number)"
          gh workflow run validate.yml --ref "$branch"
          deadline="$((SECONDS + 900))"
          while :; do
            source_gate="$(gh run list --workflow validate.yml --branch "$branch" --event workflow_dispatch --limit 20 --json headSha,status,conclusion | jq -rc --arg revision "$revision" '.[] | select(.headSha == $revision) | @base64' | head -n 1)"
            if [ -n "$source_gate" ]; then
              source_gate_json="$(printf '%s' "$source_gate" | base64 --decode)"
              [ "$(printf '%s' "$source_gate_json" | jq -r .status)" = "completed" ] || { sleep 5; continue; }
              [ "$(printf '%s' "$source_gate_json" | jq -r .conclusion)" = "success" ] || { echo "The signed adoption source gate failed." >&2; exit 1; }
              break
            fi
            [ "$SECONDS" -lt "$deadline" ] || { echo "Timed out waiting for signed adoption source gate." >&2; exit 1; }
            sleep 5
          done
          review_body="@codex review"$'\n\n'"This is an immutable first-party adoption generated by protected workflow ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. It has passed the Factory source gate. Review the exact source heads, retained release history and KMS adoption sidecar before merging."
          gh pr comment "$pull_number" --body "$review_body"
          {
            echo "## First-party adoption PR"
            echo
            echo "${pull_url}"
            echo
            echo "The workflow intentionally does **not** merge this migration PR. It requires review and a protected-branch merge."
          } >> "$GITHUB_STEP_SUMMARY"
