name: Reconcile official marketplace smoke callback

on:
  workflow_call:
    outputs:
      stable_requests:
        description: Number of exact smoke-gated Stable publication requests dispatched.
        value: ${{ jobs.validate-and-promote.outputs.stable_requests }}
    inputs:
      trigger_kind:
        required: false
        type: string
      delivery_key:
        required: false
        type: string
      plugin_id:
        required: false
        type: string
      source_repository:
        required: false
        type: string
      source_ref:
        required: false
        type: string
      source_sha:
        required: false
        type: string
      marketplace_revision:
        required: false
        type: string
      channel:
        required: false
        type: string
      smoke_workflow_run_id:
        required: false
        type: string
      smoke_workflow_run_attempt:
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: xsec-marketplace-reconcile-smoke-${{ inputs.marketplace_revision }}
  cancel-in-progress: false

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    outputs:
      stable_requests: ${{ steps.promote.outputs.stable_requests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate the complete Cloud smoke payload
        id: request
        env:
          TRIGGER_KIND: ${{ inputs.trigger_kind }}
          DELIVERY_KEY: ${{ inputs.delivery_key }}
          PLUGIN_ID: ${{ inputs.plugin_id }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MARKETPLACE_REVISION: ${{ inputs.marketplace_revision }}
          CHANNEL: ${{ inputs.channel }}
          SMOKE_RUN_ID: ${{ inputs.smoke_workflow_run_id }}
          SMOKE_RUN_ATTEMPT: ${{ inputs.smoke_workflow_run_attempt }}
        run: |
          set -euo pipefail
          [ "$TRIGGER_KIND" = "smoke_callback" ] || { echo "Unexpected reconciliation trigger kind." >&2; exit 1; }
          [ -z "$PLUGIN_ID" ] && [ -z "$SOURCE_REPOSITORY" ] && [ -z "$SOURCE_REF" ] && [ -z "$SOURCE_SHA" ] || { echo "Smoke callbacks must not carry source fields." >&2; exit 1; }
          python scripts/external_source_factory.py --github-output "$GITHUB_OUTPUT" prepare-reconcile-smoke \
            --delivery-key "$DELIVERY_KEY" --marketplace-revision "$MARKETPLACE_REVISION" --channel "$CHANNEL" \
            --smoke-workflow-run-id "$SMOKE_RUN_ID" --smoke-workflow-run-attempt "$SMOKE_RUN_ATTEMPT"
      - name: Accept only a smoke revision retained by protected Factory main
        env:
          MARKETPLACE_REVISION: ${{ steps.request.outputs.marketplace_revision }}
        run: |
          set -euo pipefail
          git cat-file -e "${MARKETPLACE_REVISION}^{commit}"
          git merge-base --is-ancestor "$MARKETPLACE_REVISION" refs/remotes/origin/main || {
            echo "Smoke callback does not name a protected, retained Factory revision." >&2
            exit 1
          }
      - name: Promote only smoke-verified Beta pointers whose source main is current
        if: ${{ steps.request.outputs.channel == 'beta' }}
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          MARKETPLACE_REVISION: ${{ steps.request.outputs.marketplace_revision }}
          SMOKE_RUN_ID: ${{ steps.request.outputs.smoke_workflow_run_id }}
        run: |
          set -euo pipefail
          # Read current Registry again, and compare its current beta pointer
          # to the exact smoke-tested revision. A later beta cannot inherit an
          # earlier callback. publish.yml then rechecks the release ID *and*
          # exact Beta source SHA after it acquires the publication slot,
          # before moving only channels.stable.
          wait_for_publish_queue() {
            deadline="$((SECONDS + 900))"
            while :; do
              queued_runs="$(gh run list --workflow publish.yml --branch main --event workflow_dispatch --limit 100 --json status | jq '[.[] | select(.status == "queued")] | length')"
              [ "$queued_runs" = "0" ] && return
              [ "$SECONDS" -lt "$deadline" ] || {
                echo "Timed out waiting for the Marketplace publication queue." >&2
                exit 1
              }
              sleep 5
            done
          }
          wait_for_dispatched_publish_run() {
            known_run_ids="$1"
            deadline="$((SECONDS + 900))"
            observed=false
            while :; do
              runs="$(gh run list --workflow publish.yml --branch main --event workflow_dispatch --limit 100 --json databaseId,status)"
              if printf '%s' "$runs" | jq -e --arg known "|${known_run_ids}|" '
                any(.[]; .databaseId as $database_id | ($known | contains("|" + ($database_id | tostring) + "|") | not))
              ' >/dev/null; then
                observed=true
              fi
              queued_runs="$(printf '%s' "$runs" | jq '[.[] | select(.status == "queued")] | length')"
              [ "$observed" = "true" ] && [ "$queued_runs" = "0" ] && return
              [ "$SECONDS" -lt "$deadline" ] || {
                echo "Timed out waiting for the dispatched Marketplace publication run to leave the queue." >&2
                exit 1
              }
              sleep 5
            done
          }
          stable_requests=0
          while IFS= read -r registration; do
            plugin_id="$(printf '%s' "$registration" | jq -r .pluginId)"
            repository="$(printf '%s' "$registration" | jq -r .source.repository)"
            active="$(printf '%s' "$registration" | jq -r .status)"
            [ "$active" = "active" ] || continue
            smoke_beta="$(git show "${MARKETPLACE_REVISION}:.xsec-factory/snapshots/${plugin_id}/.xsec-market/releases.json" 2>/dev/null | jq -r '.channels.beta.releaseId // empty' || true)"
            smoke_status="$(git show "${MARKETPLACE_REVISION}:.xsec-factory/official-status/${plugin_id}.json" 2>/dev/null || true)"
            smoke_status_state="$(printf '%s' "$smoke_status" | jq -r '.publication.state // empty' 2>/dev/null || true)"
            smoke_status_beta="$(printf '%s' "$smoke_status" | jq -r '.release.betaReleaseId // empty' 2>/dev/null || true)"
            smoke_beta_sha="$(printf '%s' "$smoke_status" | jq -r '.source.betaSha // empty' 2>/dev/null || true)"
            current_status="$(cat ".xsec-factory/official-status/${plugin_id}.json" 2>/dev/null || true)"
            current_status_state="$(printf '%s' "$current_status" | jq -r '.publication.state // empty' 2>/dev/null || true)"
            current_status_beta="$(printf '%s' "$current_status" | jq -r '.release.betaReleaseId // empty' 2>/dev/null || true)"
            current_beta_sha="$(printf '%s' "$current_status" | jq -r '.source.betaSha // empty' 2>/dev/null || true)"
            current_beta="$(jq -r '.channels.beta.releaseId // empty' ".xsec-factory/snapshots/${plugin_id}/.xsec-market/releases.json" 2>/dev/null || true)"
            # A later main source event can downgrade the exact same Beta to
            # waiting_for_beta if main no longer rebuilds it. Never let an
            # older retained smoke revision bypass that current gate. Both
            # revisions must therefore name the same waiting-for-smoke tuple
            # before this workflow is allowed to invoke the Stable publisher.
            [ "$smoke_status_state" = "waiting_for_smoke" ] \
              && [ "$current_status_state" = "waiting_for_smoke" ] \
              && [ -n "$smoke_beta" ] \
              && [ "$smoke_beta" = "$smoke_status_beta" ] \
              && [ "$smoke_beta" = "$current_status_beta" ] \
              && [ "$smoke_beta" = "$current_beta" ] \
              && [ "$smoke_beta_sha" = "$current_beta_sha" ] || continue
            [[ "$smoke_beta_sha" =~ ^[a-f0-9]{40}$ ]] || continue
            main_sha="$(git -c credential.helper= -c http.followRedirects=false ls-remote "https://github.com/${repository}.git" refs/heads/main | awk 'NR == 1 { print $1 }')"
            [ -n "$main_sha" ] || { echo "Cannot resolve registered source main for ${plugin_id}." >&2; exit 1; }
            wait_for_publish_queue
            known_run_ids="$(gh run list --workflow publish.yml --branch main --event workflow_dispatch --limit 100 --json databaseId | jq -r '[.[].databaseId | tostring] | join("|")')"
            gh workflow run publish.yml --ref main \
              -f channel=stable -f plugin_id="$plugin_id" -f source_sha="$main_sha" -f release_id="$current_beta" -f expected_beta_sha="$smoke_beta_sha" \
              -f smoke_run_url="https://github.com/tzf1003/xSecDesktop/actions/runs/${SMOKE_RUN_ID}" \
              -f smoke_marketplace_revision="$MARKETPLACE_REVISION"
            wait_for_dispatched_publish_run "$known_run_ids"
            stable_requests="$((stable_requests + 1))"
          done < <(jq -c '.plugins[]' .xsec-factory/official-registry.json)
          echo "stable_requests=$stable_requests" >> "$GITHUB_OUTPUT"
