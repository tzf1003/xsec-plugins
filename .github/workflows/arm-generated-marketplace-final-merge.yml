name: Arm generated Marketplace final merge gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  arm-final-gate:
    # This is evaluated from the trusted default branch workflow. It must not
    # check out or execute PR files.  It writes a pending status for Factory
    # branches and a success/not-applicable status for every other main PR, so
    # the required context never deadlocks normal product or documentation PRs.
    runs-on: ubuntu-latest
    steps:
      - name: Classify trusted PR metadata without reading PR files
        id: classify
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$PR_BASE" = "main" ] || {
            echo "Final merge gate only applies to main PRs." >&2
            exit 1
          }
          [[ "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "Factory PR head SHA is malformed." >&2
            exit 1
          }
          [[ "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "Factory PR base SHA is malformed." >&2
            exit 1
          }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Factory PR number is malformed." >&2
            exit 1
          }
          # Statuses are keyed only by SHA, not PR number. An ordinary/fork PR
          # can point at the same commit as a Factory PR that was later closed
          # without merging. GitHub's per-commit association endpoint omits
          # closed-unmerged PRs while a commit is outside the default branch,
          # so inspect every main-targeting PR (open and closed) instead. No PR
          # content is checked out or executed.
          # `gh api --paginate` writes one JSON array per response page. Slurp
          # all pages before evaluating the predicate: otherwise jq's exit
          # status would reflect only the final page and an ordinary PR sharing
          # this SHA could overwrite a Factory candidate's pending status.
          main_prs="$(gh api --paginate --slurp "repos/${REPOSITORY}/pulls?state=all&base=main&per_page=100")"
          factory_for_sha="$(printf '%s' "$main_prs" | jq -e --arg repo "$REPOSITORY" --arg sha "$PR_HEAD_SHA" 'any(.[][]; .head.sha == $sha and .head.repo.full_name == $repo and (.head.ref | startswith("xsec-marketplace/publish-") or startswith("xsec-marketplace/external-beta-") or startswith("xsec-marketplace/external-stable-") or startswith("xsec-marketplace/promote-stable-") or startswith("xsec-marketplace/stage-first-party-adoption-") or startswith("xsec-marketplace/adopt-first-party-") or startswith("xsec-marketplace/refresh-retained-sidecar-") or startswith("xsec-marketplace/layout-signatures-") or startswith("xsec-marketplace/default-set-")))' >/dev/null && echo true || echo false)"
          # A Factory release diff may be cherry-picked onto a normally named
          # branch, with a no-op commit making its SHA distinct from every
          # generated branch.  Classify that *content* as privileged too.
          # This only consumes GitHub's authenticated PR-file metadata; the
          # pull_request_target job never checks out or executes PR content.
          # The classifier is deliberately a conservative superset: a normal
          # PR that touches a release/signature/provenance surface stays
          # pending until the independent final workflow cryptographically
          # revalidates the exact tree, rather than receiving a shared-SHA
          # not-applicable success status.
          pr_metadata="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          [ "$(printf '%s' "$pr_metadata" | jq -er .base.sha)" = "$PR_BASE_SHA" ] && [ "$(printf '%s' "$pr_metadata" | jq -er .head.sha)" = "$PR_HEAD_SHA" ] || {
            echo "PR head/base changed while the Factory gate was classifying it." >&2
            exit 1
          }
          changed_file_count="$(printf '%s' "$pr_metadata" | jq -er '.changed_files | if type == "number" and floor == . and . >= 0 then . else error("invalid changed_files") end')"
          pr_files="$(gh api --paginate --slurp "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          # GitHub's PR file endpoint labels a renamed Gitlink only with its
          # destination filename. Compare immutable base/head trees so adds,
          # removals, moves and revision updates remain pending regardless of
          # their location; a truncated or malformed tree also stays pending.
          base_tree="$(gh api "repos/${REPOSITORY}/git/trees/${PR_BASE_SHA}?recursive=1")"
          head_tree="$(gh api "repos/${REPOSITORY}/git/trees/${PR_HEAD_SHA}?recursive=1")"
          if base_gitlinks="$(printf '%s' "$base_tree" | jq -ce '
              if .truncated == false and (.tree | type == "array") then
                [
                  .tree[]
                  | select((.mode == "160000") or (.type == "commit"))
                  | if (
                    (.path | type == "string")
                    and .mode == "160000"
                    and .type == "commit"
                    and (.sha | type == "string" and test("^[a-f0-9]{40}$"))
                  ) then {path: .path, sha: .sha} else error("invalid Gitlink") end
                ]
                | sort_by(.path)
                | if (map(.path) | unique | length) == length then . else error("duplicate Gitlink") end
              else error("incomplete Git tree") end
            ')" && head_gitlinks="$(printf '%s' "$head_tree" | jq -ce '
              if .truncated == false and (.tree | type == "array") then
                [
                  .tree[]
                  | select((.mode == "160000") or (.type == "commit"))
                  | if (
                    (.path | type == "string")
                    and .mode == "160000"
                    and .type == "commit"
                    and (.sha | type == "string" and test("^[a-f0-9]{40}$"))
                  ) then {path: .path, sha: .sha} else error("invalid Gitlink") end
                ]
                | sort_by(.path)
                | if (map(.path) | unique | length) == length then . else error("duplicate Gitlink") end
              else error("incomplete Git tree") end
            ')" && [ "$base_gitlinks" = "$head_gitlinks" ]; then
            gitlink_changed=false
          else
            gitlink_changed=true
          fi
          returned_file_count="$(printf '%s' "$pr_files" | jq -er '
            [.[][]]
            | if all(.[];
                type == "object"
                and (.filename | type == "string")
                and ((has("previous_filename") | not) or (.previous_filename | type == "string"))
              ) then length else error("invalid PR file response") end
          ')"
          layout_migration="$(printf '%s' "$pr_files" | jq -e 'any(.[][]; .filename == ".xsec-factory/layout-migration.json")' >/dev/null && echo true || echo false)"
          if [ "$returned_file_count" -ne "$changed_file_count" ]; then
            # GitHub bounds this endpoint for huge diffs. Its incomplete
            # content inventory must never produce a not-applicable success.
            factory_content=true
          else
            factory_content="$(printf '%s' "$pr_files" | jq -e '
              def plugin_id: "[a-z0-9](?:[a-z0-9.-]{0,62}[a-z0-9])?";
              def release_index: test("^\\.xsec-factory/snapshots/" + plugin_id + "/\\.xsec-market/releases\\.json$");
              def release_sidecar: test("^\\.xsec-factory/snapshots/" + plugin_id + "/\\.xsec-market/releases\\.json\\.sig\\.jws\\.json$");
              def factory_document: test("^\\.xsec-factory/(?:official-registry\\.json|official-(?:publications|publication-proofs|adoptions|adoption-proofs|status)/" + plugin_id + "\\.json)$");
              def subproject: test("^plugins/" + plugin_id + "$");
              def submodule_manifest: . == ".gitmodules";
              def factory_path: release_index or release_sidecar or factory_document or subproject or submodule_manifest;
              any(.[][]; [.filename, (.previous_filename? // "")] | any(.[]; factory_path))
            ' >/dev/null && echo true || echo false)"
          fi
          case "$PR_HEAD_REPOSITORY:$PR_HEAD_REF" in
            "$REPOSITORY":xsec-marketplace/publish-*|"$REPOSITORY":xsec-marketplace/external-beta-*|"$REPOSITORY":xsec-marketplace/external-stable-*|"$REPOSITORY":xsec-marketplace/promote-stable-*|"$REPOSITORY":xsec-marketplace/stage-first-party-adoption-*|"$REPOSITORY":xsec-marketplace/adopt-first-party-*|"$REPOSITORY":xsec-marketplace/refresh-retained-sidecar-*|"$REPOSITORY":xsec-marketplace/layout-signatures-*|"$REPOSITORY":xsec-marketplace/default-set-*) event_factory=true ;;
            *) event_factory=false ;;
          esac
          if [ "$layout_migration" = "true" ] || [ "$event_factory" = "true" ] || [ "$factory_for_sha" = "true" ] || [ "$factory_content" = "true" ] || [ "$gitlink_changed" = "true" ]; then
            # A pending layout marker is privileged Factory content. Its exact
            # transition must remain pending for protected revalidation.
            echo "factory_generated=true" >> "$GITHUB_OUTPUT"
          else
            # An external fork or any non-Factory same-base branch cannot
            # obtain a release merge from this status; source-gate and the
            # normal PR policy still apply. It simply does not need the
            # Factory-only final revalidation workflow.
            echo "factory_generated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep Factory PRs pending and mark non-Factory PRs not applicable
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FACTORY_GENERATED: ${{ steps.classify.outputs.factory_generated }}
        run: |
          set -euo pipefail
          if [ "$FACTORY_GENERATED" = "true" ]; then
            state=pending
            description='Awaiting protected final source/Codex revalidation and exact-head merge.'
          else
            state=success
            description='Not a Factory-generated Marketplace publication PR.'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -f state="$state" \
            -f context=factory-final-merge-gate \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/final-merge-generated-marketplace-pr.yml"
